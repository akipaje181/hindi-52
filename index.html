<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D7BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ヒンディー語52週">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ヒンディー語52週</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&family=Noto+Sans:ital,wght@0,500;0,600&display=swap">
<style>
/* Layout: 青空の搭乗券（今日の週）を主役に、白いカードと色つきの丸アイコンで「旅のしおり」のように軽く。明るい1テーマ。 */
:root{
  --bg:#F1F6FF; --surface:#FFFFFF; --ink:#1F2B4D; --muted:#66729A; --line:#E0E8F6;
  --indigo:#3D7BFF; --indigo-2:#2C63E6; --on-indigo:#FFFFFF; --on-indigo-muted:#DCE8FF;
  --accent:#FF7A45; --accent-ink:#D4501A; --accent-soft:#FFEDE3;
  --green:#18B487; --green-soft:#DCF6EC; --red:#EF4E5A; --red-soft:#FDE5E7;
  --yellow:#FFC93C; --yellow-soft:#FFF4D2; --pink:#FF7EA8; --pink-soft:#FFE6EF; --purple:#8A6BFF; --purple-soft:#EEE9FF; --sky-soft:#E3EEFF;
  --tint:#EDF3FD; --shadow:0 10px 24px -14px rgba(61,123,255,.45),0 2px 6px -2px rgba(31,43,77,.08);
  --f-head:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-en:"Noto Sans Devanagari","Kohinoor Devanagari","Devanagari Sangam MN",sans-serif;
  --f-rom:"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Nunito","Avenir Next",ui-rounded,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--indigo-2)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:22px 120px}
.en{font-family:var(--f-en);letter-spacing:0;font-feature-settings:"kern"}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-family:var(--f-head);font-size:27px;font-weight:900;letter-spacing:.02em}
h2{font-family:var(--f-head);font-size:20px;font-weight:700;letter-spacing:.02em}
h3{font-size:15.5px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:44px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.btn.primary:hover{background:var(--indigo-2)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 13px;min-height:36px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 8px;background:var(--tint);color:var(--muted)}
.chip.a{background:var(--accent-soft);color:var(--accent-ink)}
.chip.g{background:var(--green-soft);color:var(--green)}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;color:var(--indigo-2)}
.speak svg{width:15px;height:15px}
.speak:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* page header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.daybadge{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* 搭乗券（今日の週） */
.pass{display:grid;grid-template-columns:1fr 128px;background:linear-gradient(135deg,#3D7BFF 0%,#5B9BFF 55%,#86C8FF 100%);background-size:cover;background-position:center;color:var(--on-indigo);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.pass.has-img{background-image:linear-gradient(90deg,rgba(45,99,230,.92) 0%,rgba(61,123,255,.70) 55%,rgba(61,123,255,.25) 100%),var(--hero)}
.pass::after{content:"";position:absolute;right:140px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);pointer-events:none}
.pass-main{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pass-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--on-indigo-muted)}
.route{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.route .end b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.06em;line-height:1}
.route .end small{font-size:10.5px;color:var(--on-indigo-muted)}
.route .end:last-child{text-align:right}
.flight{position:relative;height:22px}
.flight .seg{position:absolute;top:10px;height:2px;background:color-mix(in srgb,var(--on-indigo) 22%,transparent)}
.flight .seg.on{background:var(--yellow)}
.flight .dot{position:absolute;top:7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--indigo);border:2px solid color-mix(in srgb,var(--on-indigo) 45%,transparent)}
.flight .plane{position:absolute;top:0;width:22px;height:22px;margin-left:-11px;color:var(--yellow);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));transition:left .8s cubic-bezier(.2,.7,.2,1)}
.flight .plane svg{width:22px;height:22px;fill:currentColor;transform:rotate(90deg)}
.pass-title small{font-family:var(--f-mono);font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--yellow)}
.pass-title h2{color:var(--on-indigo);font-size:23px;margin-top:2px}
.pass-title p{font-size:13.5px;color:var(--on-indigo-muted);margin-top:6px}
.pass-stub{border-left:2px dashed rgba(255,255,255,.55);padding:18px 14px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.16);position:relative}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.pass-stub::before{top:-9px}.pass-stub::after{bottom:-9px}
.pass-stub div small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--on-indigo-muted);text-transform:uppercase}
.pass-stub div b{font-family:var(--f-mono);font-size:15px;font-weight:600;line-height:1.3}
@media (max-width:480px){.pass{grid-template-columns:1fr}.pass-stub{border-left:none;border-top:2px dashed color-mix(in srgb,var(--on-indigo) 30%,transparent);flex-direction:row;justify-content:space-between;padding:12px 20px}.pass-stub::before,.pass-stub::after{top:-10px;left:auto;bottom:auto}.pass-stub::before{left:-9px}.pass-stub::after{right:-9px}}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phases div{font-size:11px;line-height:1.4;padding:7px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.phases div b{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}
.phases div.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.goal{border-left:3px solid var(--accent);padding-left:10px;font-size:14px}

/* tasks */
.tasks{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:14px 16px;width:100%;transition:background .15s}
.task:first-child{border-top:none}
.task:hover{background:var(--tint)}
.task .ic{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted)}
.task.done .ic{background:var(--green);border-color:var(--green);color:#fff}
.task.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task b{display:block;font-size:15px}
.task small{color:var(--muted);font-size:12.5px;display:block;line-height:1.5;margin-top:1px}
.task .min{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:none}
.stat b{display:block;font-family:var(--f-mono);font-size:21px;font-weight:600;line-height:1.25}
.stat span{font-size:11px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:none}.stat:nth-child(n+3){border-top:1px solid var(--line)}.phases{grid-template-columns:repeat(2,1fr)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;width:100%}
.nav button{border:none;background:none;padding:9px 2px 10px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;position:relative}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button.on{color:var(--indigo-2)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent)}

/* lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lhead{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:2;padding-top:env(safe-area-inset-top,0px)}
.lhead .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.lhead h3{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-head)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.lbody{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}

/* flash card */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:30px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.flash .word{font-family:var(--f-en);font-size:36px;font-weight:600;line-height:1.2;overflow-wrap:anywhere;color:var(--ink)}
.flash .jp{font-size:21px;font-weight:700}
.flash .ex{font-size:14.5px;color:var(--muted)}
.flash .ex .en{color:var(--ink);font-size:18px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 4px;font-weight:700;font-size:14px;line-height:1.3}
.rate button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.rate .r0{color:var(--red)} .rate .r2{color:var(--green)}
.rate .r0:hover{background:var(--red-soft)} .rate .r2:hover{background:var(--green-soft)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* grammar */
.point{display:grid;grid-template-columns:28px 1fr;gap:12px}
.point .n{font-family:var(--f-mono);font-weight:600;color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:50%;height:28px;display:grid;place-items:center;font-size:12px}
.exline{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.exline:first-child{border-top:none}
.exline .t{min-width:0;flex:1}
.exline .en{font-size:17.5px;display:block;line-height:1.5}
.tip{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 14px;font-size:14px}

/* shadowing */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700}
.steps button.on{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.dl{display:flex;gap:10px;padding:10px 12px;border-radius:10px;align-items:flex-start;border:1px solid transparent}
.dl.playing{background:var(--accent-soft);border-color:var(--accent)}
.dl.mine{background:var(--green-soft)}
.dl .who{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--muted);min-width:66px;padding-top:5px;line-height:1.3;letter-spacing:.04em}
.dl .t{flex:1;min-width:0}
.dl .en{font-size:17.5px;line-height:1.5;display:block}
.dl .en.blur{filter:blur(6px);user-select:none}
.dl .ja{font-size:13px;color:var(--muted);display:block}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:40px}

/* writing / AI */
textarea,input[type=text],input[type=date],input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;line-height:1.6}
textarea{min-height:140px;resize:vertical;font-family:var(--f-en);font-size:16px}
.ai{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:14px 16px;font-size:14.5px;overflow-wrap:anywhere}
.ai h4{margin:10px 0 4px;font-size:14px}
.ai ul{margin:4px 0;padding-left:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.bub.ai2{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--indigo);color:var(--on-indigo);border-bottom-right-radius:4px}
.bub .row{margin-top:6px}

/* quiz */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:15px}
.opt.ok{background:var(--green-soft);border-color:var(--green)}
.opt.ng{background:var(--red-soft);border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-family:var(--f-en);font-size:17px}
.tile.used{opacity:.25}
.answer{min-height:54px;border:1px dashed var(--muted);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px}

/* roadmap */
.phase{display:flex;flex-direction:column;gap:10px}
.phead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.pnum{font-family:var(--f-head);font-weight:900;font-size:40px;line-height:1;color:var(--accent)}
.targets{display:flex;flex-wrap:wrap;gap:6px}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;width:100%}
.wk:hover{background:var(--tint)}
.wk .wn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.wk.cur{background:var(--accent-soft);border-radius:8px;border-top-color:transparent}
.wk.cur .wn{color:var(--accent-ink);font-weight:600}
.wk.done .wn{color:var(--green)}

/* record */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--tint)}
.heat i.l1{background:color-mix(in srgb,var(--green) 35%,var(--tint))}
.heat i.l2{background:color-mix(in srgb,var(--green) 65%,var(--tint))}
.heat i.l3{background:var(--green)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;border-bottom:1px solid var(--line);overflow-x:auto}
.bars div{flex:1 0 8px;max-width:22px;background:var(--indigo-2);border-radius:3px 3px 0 0;min-height:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}

.guide p+p{margin-top:8px}
.guide ul{margin:6px 0;padding-left:20px}
.guide li{margin:3px 0}
.res{display:grid;gap:8px}
.res div{border-top:1px solid var(--line);padding-top:8px}
.res b{display:block}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--indigo);color:var(--on-indigo);padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:50;max-width:90vw}
.note{font-size:12.5px;color:var(--muted);background:var(--tint);border-radius:10px;padding:9px 13px}
.celebrate{background:var(--green);color:#fff;border-radius:12px;padding:16px 18px}
.celebrate .btn{background:#fff;color:var(--green);border-color:#fff}

/* 会話ノート */
.pick{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:none}
.pick input{width:18px;height:18px;margin-top:4px;accent-color:var(--green)}
.pick .en{font-size:16.5px;display:block;line-height:1.45}
.notecard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.notecard:hover{border-color:var(--muted)}
.notecard p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;color:var(--muted)}
.fix{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.fix .old{text-decoration:line-through;color:var(--muted);font-family:var(--f-en)}
.fix .new{color:var(--green);font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* 自己紹介 */
.introbtn{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

/* ============ ヒンディー語：データをそろえる（hi → en、ローマ字の辞書） ============
   教材は hi（デーヴァナーガリー）・rom（ローマ字）・ja・eng。アプリの中では英語版と同じく .en を「学ぶ言葉」として使う */
const ROM={};
function addRom(h,r){if(h&&r&&typeof h==="string"&&!ROM[h])ROM[h]=String(r)}
function normItem(o){if(!o)return o;if(o.hi!=null&&o.en==null)o.en=o.hi;addRom(o.en,o.rom);addRom(o.ex,o.exRom);addRom(o.improved,o.improvedRom);return o}
(window.WEEKS||[]).forEach(w=>{
  (w.letters||[]).forEach(l=>{l.en=l.ch;addRom(l.ch,l.rom);addRom(l.ex,l.exRom)});
  if(w.grammar)(w.grammar.examples||[]).forEach(normItem);
  (w.vocab||[]).forEach(normItem);(w.sentences||[]).forEach(normItem);
  if(w.dialogue)(w.dialogue.lines||[]).forEach(normItem)});
function regNote(n){if(!n)return;["sentences","grammar","vocab","fixes","dialogue"].forEach(k=>(n[k]||[]).forEach(normItem))}
function romOf(s){return ROM[s]||""}
/* 学ぶ言葉を表示：設定で「文字＋ローマ字」「文字だけ」「ローマ字だけ」 */
function tg(s){const r=romOf(s);const m=(typeof S!=="undefined"&&S.settings&&S.settings.script)||"both";
  if(m==="rom"&&r)return `<span class="hi-rom">${esc(r)}</span>`;
  return `<span class="hi">${esc(s)}</span>${m==="both"&&r?`<span class="rom">${esc(r)}</span>`:""}`}

/* ============ 52週の骨組み（データ未読込でもロードマップは表示） ============ */
const PHASES=[
 {n:1,name:"文字と音・自己紹介",months:"1〜3か月目",weeks:[1,13],cefr:"A0 → A1",check:"1分の自己紹介",

 {n:2,name:"日常会話・旅行",months:"4〜6か月目",weeks:[14,26],cefr:"A1 → A2",check:"旅の1日を話す（3分）",
  aim:"食事・買い物・移動・体調の話と、過去・未来のことが言える",
  res:[["ニューエクスプレスプラス ヒンディー語（白水社）","後半の課（過去形・未来形）"],["オンラインのヒンディー語レッスン（週2回・25分）","この期から開始。習った文をそのまま使う場にする"],["ボリウッド映画（英語字幕つき）","あいさつ・家族の会話の場面を何度も聞く"],["YouTube のインド旅行 vlog（ヒンディー語）","市場・駅・食堂の生の会話"]]},

 1:{name:"文法と単語①",tasks:[["grammar",10],["vocab",10,[0,7]],["shadow",15,"listen"],["speak",10]]},

 4:{name:"総復習と役になりきる",tasks:[["review",10],["sentences",15,[0,10]],["shadow",15,"role"],["speak",10]]},
 5:{name:"書く日",tasks:[["writing",15],["review",10],["speak",10]]},
 6:{name:"週テストと話す日",tasks:[["test",15],["roleplay",15]]},

function dayTasks(w){const base=DAYS[S.day].tasks;if(!w||!w.letters||!w.letters.length||S.day>4)return base;
  const n=w.letters.length,a=Math.ceil(n/3);const rng=S.day===4?[0,n]:[(S.day-1)*a,Math.min(n,S.day*a)];return [["letters",10,rng],...base]}

const diffDays=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
function fresh(){return{v:1,startDate:today(),week:1,day:1,doneToday:{date:"",tasks:[]},srs:{},log:{},tests:{},scores:[],diary:[],people:[],settings:{accent:"hi-IN",rate:0.9,dir:"en",script:"both"},updatedAt:0}}

/* ============ 音声（ブラウザの読み上げ） ============ */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(typeof TAB!=="undefined"&&TAB==="guide")render()}}
/* 声の良さを点数にして、いちばん滑らかな声を選ぶ。
   iPhone・iPad の声は voiceURI に premium（プレミアム）／enhanced（拡張）／compact（標準）が入っている */
const NOVELTY=/(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|ささやき|オルガン|スーパースター|トリノイド|ベル|道化|震え|バブル|チェロ|アルバート|ボイン|ニュース|おばあ|おじい|ジュニア|フレッド|キャシー|ラルフ|ザーボックス)/i;
const NATURAL=/(Lekha|Kiyara|Madhur|Swara|Hemant|Kalpana|Ava|Zoe|Samantha|Allison|Susan|Evan|Nathan|Tom|Noelle|Joelle|Serena|Daniel|Kate|Oliver|Stephanie|Jamie|Isha|Rishi|Sangeeta|Karen|Lee|Moira|Tessa|Google|Natural|Neural|Online)/i;
function voiceQuality(v){const s=(v.voiceURI||"")+" "+v.name;return /premium|プレミアム/i.test(s)?2:/enhanced|拡張|natural|neural|online/i.test(s)?1:0}
function voiceScore(v,accent){if(NOVELTY.test(v.name))return -999;const lang=v.lang.replace("_","-");
  return voiceQuality(v)*100+(lang==="hi-IN"?60:/^hi/.test(lang)?30:0)+(NATURAL.test(v.name)?25:0)+(/Google/.test(v.name)?10:0)}
function goodVoices(){const a=S.settings.accent;return VOICES.filter(v=>/^hi/i.test(v.lang.replace("_","-"))&&!NOVELTY.test(v.name)).sort((x,y)=>voiceScore(y,a)-voiceScore(x,a))}
function pickVoice(){const en=goodVoices();
  if(S.settings.voiceName){const f=en.find(v=>v.name===S.settings.voiceName&&(!S.settings.voiceURI||v.voiceURI===S.settings.voiceURI))||en.find(v=>v.name===S.settings.voiceName);if(f)return f}
  return en[0]||null}
let speakToken=0;
let lastCancel=0;
function stopSpeak(){speakToken++;try{if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();lastCancel=Date.now()}}catch(e){}}
function speak(text,rate){return new Promise(res=>{
  if(!("speechSynthesis" in window)){res();return}
  // 止めた直後にすぐ話し始めると、iPhone では出だしが切れたり途切れたりするので少し待つ
  const wait=Math.max(0,120-(Date.now()-lastCancel));
  setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g," ").trim());u.pitch=1;u.volume=1;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="hi-IN";
    u.rate=rate||S.settings.rate;let done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin;u.onerror=fin;try{speechSynthesis.resume()}catch(e){}setTimeout(fin,2500+String(text).length*120/(u.rate||1));speechSynthesis.speak(u)}catch(e){res()}},wait)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
function spkBtn(text){return `<button class="speak" data-say="${esc(text)}" aria-label="読み上げ">${SPK}</button>`}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function md(t){ // AIの返答を安全に整形
  const lines=esc(t).split(/\n/);let h="",inUl=false;
  for(let ln of lines){ln=ln.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^\s*[-・*]\s+/.test(ln)){if(!inUl){h+="<ul>";inUl=true}h+="<li>"+ln.replace(/^\s*[-・*]\s+/,"")+"</li>";continue}
    if(inUl){h+="</ul>";inUl=false}
    if(/^#{1,4}\s/.test(ln))h+="<h4>"+ln.replace(/^#{1,4}\s/,"")+"</h4>";else if(ln.trim())h+="<p>"+ln+"</p>"}
  if(inUl)h+="</ul>";return h}
function logMinutes(m,task){const d=today();const L=S.log[d]||(S.log[d]={m:0,t:[]});L.m+=m;if(task)L.t.push(task);if(task==="speak"||task==="roleplay")L.s=(L.s||0)+m}

const IV=[0,1,3,7,14,30,60];
function rateCard(key,r){const c=S.srs[key]||{b:0,d:today()};
  if(r===0){c.b=0;c.d=today()}else if(r===1){c.b=Math.max(1,c.b);c.d=addDays(today(),1)}else{c.b=Math.min(6,c.b+1);c.d=addDays(today(),IV[c.b])}
  S.srs[key]=c}
function cardFromKey(k){if(k[0]==="n")NOTES.forEach(regNote);const iv=k.match(/^i(\d)-(\d+)$/);if(iv)return introCard(+iv[1],+iv[2]);const n=k.match(/^n([a-z0-9]+)-([svgfd])-(\d+)$/);if(n)return noteCard(n[1],n[2],+n[3]);const m=k.match(/^([vsl])(\d+)-(\d+)$/);if(!m)return null;const w=W(+m[2]);if(!w)return null;
  const it=(m[1]==="v"?w.vocab:m[1]==="l"?(w.letters||[]):w.sentences)[+m[3]];return it?{key:k,type:m[1],item:it,week:+m[2]}:null}
function dueKeys(){const t=today();return Object.keys(S.srs).filter(k=>S.srs[k].d<=t).sort((a,b)=>S.srs[a].d<S.srs[b].d?-1:1)}

function taskRow(t,i,done,w){

  else if(type==="sentences")sub=`今週の文 ${arg[0]+1}〜${arg[1]}`;
  else if(type==="shadow")sub=SHADOWSTEP[arg]+(w?"："+w.dialogue.title:"");
  else if(type==="review")sub=`復習の時期が来たカード ${Math.min(30,dueKeys().length)}枚`;
  else if(type==="grammar")sub=w?w.grammar.title:"";

  else if(type==="test")sub="単語10問＋並べ替え5問";

  else if(type==="speak")sub="お題："+speakTopic(w).ja+"（Claude の音声モード・実際の会話・ひとりで）";
  return `<button class="task ${done?"done":""}" data-task="${i}" data-type="${type}"><span class="ic">${done?"✓":taskIcon(type)}</span><span><span class="num">STEP ${i+1}</span><b>${TASKNAME[type]}</b><small>${esc(sub)}</small></span><span class="min">${min}分</span></button>`}

/* インドの方に確認してもらうための文章（英語の説明つき） */
function reviewText(w){const L=[];
  L.push("Hi! I'm learning Hindi with my own study app. Could you please check if these Hindi sentences are natural and correct? Just tell me the number and a better way to say it. Thank you so much! 🙏");
  L.push("","*Week "+w.week+"*");
  L.push("","*Words (example sentences)*");w.vocab.forEach((v,i)=>L.push(`${i+1}. ${v.hi||v.en} (${v.eng||""}) — ${v.ex}`));
  L.push("","*Sentences*");w.sentences.forEach((x,i)=>L.push(`${i+1}. ${x.hi||x.en}${x.eng?"  = "+x.eng:""}`));
  L.push("","*Grammar examples*");w.grammar.examples.forEach((x,i)=>L.push(`${i+1}. ${x.hi||x.en}${x.eng?"  = "+x.eng:""}`));
  L.push("","*Conversation*");w.dialogue.lines.forEach(l=>L.push(`${l.name}: ${l.hi||l.en}`));
  return L.join("\n")}

/* ============ レッスン画面 ============ */
let onClose=null;
let WAKE=null;
async function keepAwake(on){try{if(on&&!WAKE&&navigator.wakeLock){WAKE=await navigator.wakeLock.request("screen");WAKE.addEventListener("release",()=>{WAKE=null})}else if(!on&&WAKE){await WAKE.release();WAKE=null}}catch(e){WAKE=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("#lesson").hidden)keepAwake(true)});
function openLesson(title,chip,html,after){keepAwake(true);
  stopSpeak();const L=$("#lesson");$("#ltitle").textContent=title;$("#lchip").textContent=chip||"";$("#lchip").hidden=!chip;
  const body=$("#lbody");body.innerHTML=typeof html==="function"?html():html;L.hidden=false;L.scrollTop=0;$("#nav").hidden=true;
  if(after)after(body)}
function closeLesson(){stopSpeak();keepAwake(false);$("#lesson").hidden=true;$("#nav").hidden=false;const f=onClose;onClose=null;if(f)f();render()}
$("#lback").onclick=closeLesson;
function finishBtn(label){return `<div class="row" style="margin-top:8px"><button class="btn primary" data-finish>${label||"完了にする"}</button></div>`}
function bindFinish(body,cb){body.querySelectorAll("[data-finish]").forEach(b=>b.onclick=cb)}
function completeTask(ti,min,name){
  if(ti!=null){if(S.doneToday.date!==today())S.doneToday={date:today(),tasks:[]};if(!S.doneToday.tasks.includes(ti))S.doneToday.tasks.push(ti)}
  logMinutes(min,name);save();closeLesson();toast("記録しました")}

function runTask(t,w,ti){
  const [type,min,arg]=t;
  if(!w&&type!=="review"&&type!=="input"&&type!=="speak"){toast("この週の教材データがまだありません");return}
  const done=(alt)=>completeTask(ti,min,typeof alt==="string"?alt:type);

function lessonShadow(w,step,done){
  const lines=w.dialogue.lines;let st=step||"listen",showJa=st==="listen"||st==="read",role="A",rate=S.settings.rate,playing=-1,reps=0;
  const speakers=[...new Set(lines.map(l=>l.s))];
  function enClass(){return (st==="listen"||st==="shadow")?"en blur":"en"}
  function draw(body){
    body.innerHTML=`<div class="stack"><div class="mascot-side">${pic("aki-listen","","")}<div><div class="eyebrow">${esc(w.scene)}</div><h2>${esc(w.dialogue.title)}</h2></div></div>
     <div class="steps">${Object.keys(SHADOWSTEP).map(k=>`<button data-st="${k}" class="${k===st?"on":""}">${SHADOWSTEP[k]}</button>`).join("")}</div>
     <p class="note">${{listen:"文を見ずに2回聞きます。わからなくても大丈夫。日本語訳で内容をつかみます。",read:"文（文字とローマ字）を見ながら聞き、わからない単語を確認します。",overlap:"文を見ながら、音声と同時に声を重ねて読みます（オーバーラッピング）。3回。",shadow:"文を見ずに、音声の0.5秒あとを影のように追いかけて言います。3回。",role:"相手のセリフは音声が読み、あなたの番（緑）は止まります。文を見ずに言えたら合格。"}[st]}</p>
     ${st==="role"&&speakers.length>1?`<div class="row"><span class="small">あなたの役：</span>${speakers.map(s=>{const nm=(lines.find(l=>l.s===s)||{}).name||s;return `<button class="btn sm ${role===s?"primary":""}" data-role="${s}">${esc(nm)}</button>`}).join("")}</div>`:""}
     <div class="stack" style="gap:4px">${lines.map((l,k)=>`<div class="dl ${k===playing?"playing":""} ${st==="role"&&l.s===role?"mine":""}" data-line="${k}">
       <span class="who">${esc(l.name||l.s)}</span><div class="t"><span class="${st==="role"&&l.s===role?"en blur":enClass()}">${tg(l.en)}</span>${showJa?`<span class="ja">${esc(l.ja)}</span>`:""}</div>${spkBtn(l.en)}</div>`).join("")}</div>
     <div class="row"><button class="btn sm ghost" id="tja">${showJa?"日本語を隠す":"日本語を表示"}</button><button class="btn sm ghost" id="ten">文を一時表示</button></div>
     <div class="ctrl"><button class="btn accent" id="play">▶ 再生</button><button class="btn" id="stop">■ 止める</button>
      <select id="rate" aria-label="速さ">${[0.6,0.7,0.8,0.9,1].map(r=>`<option value="${r}" ${r==rate?"selected":""}>速さ ${r}</option>`).join("")}</select>
      <span class="small muted mono">${reps}回</span><button class="btn primary" data-finish style="margin-left:auto">完了</button></div></div>`;
    bindFinish(body,done);
    body.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{stopSpeak();st=b.dataset.st;showJa=st==="listen"||st==="read";playing=-1;draw(body)});
    body.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;draw(body)});
    body.querySelector("#tja").onclick=()=>{showJa=!showJa;draw(body)};
    body.querySelector("#ten").onclick=()=>{body.querySelectorAll(".en.blur").forEach(e=>e.classList.remove("blur"))};
    body.querySelector("#rate").onchange=e=>{rate=+e.target.value};
    body.querySelector("#stop").onclick=()=>{stopSpeak();playing=-1;draw(body)};
    body.querySelector("#play").onclick=async()=>{stopSpeak();const tk=++speakToken;
      for(let k=0;k<lines.length;k++){if(tk!==speakToken)return;playing=k;mark(body,k);
        const l=lines[k];
        if(st==="role"&&l.s===role){const words=l.en.split(/\s+/).length;await sleep(Math.max(2500,words*600/rate))}
        else{await speak(l.en,rate);await sleep(st==="listen"||st==="read"?500:300)}}
      if(tk===speakToken){playing=-1;reps++;draw(body)}};
  }
  function mark(body,k){body.querySelectorAll(".dl").forEach((e,j)=>e.classList.toggle("playing",j===k));const e=body.querySelector(`[data-line="${k}"]`);if(e)e.scrollIntoView({block:"center",behavior:"smooth"})}
  openLesson("シャドーイング",`W${w.week}`,"",draw)}

/* --- Claude アプリとの連携（ログインなしで開いたとき） --- */
const IN_ARTIFACT=!!(window.claude&&window.claude.use);
const HAS_MIC=!IN_ARTIFACT&&!!(window.SpeechRecognition||window.webkitSpeechRecognition);
function parseJSONLoose(s){s=String(s||"").trim();try{return JSON.parse(s)}catch(e){}
  const m=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=s.indexOf("{"),b=s.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}return null}
function copyText(text,fallbackEl){
  const ok=()=>toast("コピーしました。Claude に貼り付けてください");
  const ng=()=>{if(fallbackEl){fallbackEl.hidden=false;fallbackEl.focus();fallbackEl.select();toast("全部選んだ状態です。長押しでコピーしてください")}};
  try{navigator.clipboard.writeText(text).then(ok,ng)}catch(e){ng()}}
function pasteInto(ta){try{navigator.clipboard.readText().then(t=>{if(!t){toast("コピーした文章がありません");return}ta.value=(ta.value.trim()?ta.value+"\n":"")+t;ta.dispatchEvent(new Event("input"));toast("貼り付けました")},()=>{ta.focus();toast("入力欄を長押しして「ペースト」を選んでください")})}catch(e){ta.focus();toast("入力欄を長押しして「ペースト」を選んでください")}}
function claudeBridge(out,prompt,o){o=o||{};
  out.innerHTML=`<div class="card stack bridge"><div><div class="eyebrow">Claude アプリと連携</div><h3>${esc(o.title||"Claude に頼む")}</h3></div>
   <ol class="small" style="margin:0;padding-left:20px"><li>「頼む文章をコピー」を押す</li><li>「Claude を開く」→ 新しいチャットに貼り付けて送る${o.images?"（スクリーンショットがあれば一緒に添付）":""}</li><li>Claude の答えを長押し →「コピー」して、この下に貼り付ける</li></ol>
   <div class="row"><button class="btn accent" data-b="copy">頼む文章をコピー</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Claude を開く</a></div>
   <textarea data-b="src" readonly hidden style="min-height:120px;font-size:13px">${esc(prompt)}</textarea>
   ${o.noPaste?"":`<div class="spread"><label class="small" for="b-paste">Claude の答えを貼り付け</label><button class="btn sm" data-b="pastebtn">📋 貼り付け</button></div><textarea id="b-paste" data-b="paste" style="min-height:110px" placeholder="ここに貼り付け"></textarea><div><button class="btn primary" data-b="take">取り込む</button></div>`}</div>`;
  out.querySelector('[data-b="copy"]').onclick=()=>copyText(prompt,out.querySelector('[data-b="src"]'));
  const pb=out.querySelector('[data-b="pastebtn"]');if(pb)pb.onclick=()=>pasteInto(out.querySelector('[data-b="paste"]'));
  const tk=out.querySelector('[data-b="take"]');if(tk)tk.onclick=()=>{const v=out.querySelector('[data-b="paste"]').value.trim();if(!v){toast("Claude の答えを貼り付けてください");return}o.onResult&&o.onResult(v)}}
function listenOnce(){return new Promise((res,rej)=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){rej("none");return}
  const r=new R();r.lang="hi-IN";r.interimResults=false;r.maxAlternatives=1;let txt="";
  r.onresult=e=>{txt=Array.from(e.results).map(x=>x[0].transcript).join(" ")};r.onerror=e=>rej(e.error||"error");r.onend=()=>res(txt);try{stopSpeak();r.start()}catch(e){rej("start")}})}
function matchScore(model,heard){const tk=s=>normHi(s).replace(/[^\p{L}\p{M}\p{N}' ]/gu," ").split(/\s+/).filter(Boolean);const a=tk(model),b=tk(heard);if(!a.length)return 0;
  const d=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  return Math.round(d[a.length][b.length]/a.length*100)}

/* --- AI 呼び出し --- */
async function askAI(input,out,opts){
  if(!SAMPLE){const prompt=typeof input==="string"?input:input.map(m=>m.content).join("\n\n");claudeBridge(out,prompt,{title:(opts&&opts.title)||"Claude に見てもらう",onResult:v=>{out.innerHTML=`<div class="ai">${md(v)}</div>`}});return null}
  out.innerHTML=`<div class="ai"><p class="muted">考えています…</p></div>`;
  try{const r=await SAMPLE(input,Object.assign({onText:({text})=>{out.innerHTML=`<div class="ai">${md(text)}</div>`}},opts||{}));out.innerHTML=`<div class="ai">${md(r.text)}</div>`;return r.text}
  catch(e){const m=e&&e.code==="rate_limited"?"少し時間をおいてから、もう一度押してください。":e&&e.code==="not_granted"?"AI機能が許可されていません。ページ上部の権限設定から許可できます。":"AIにつながりませんでした。もう一度押してください。";
    out.innerHTML=`<p class="note">${m}</p>`;return null}}

/* --- 週テスト --- */
function lessonTest(w,done){
  const vq=shuffle(w.vocab).slice(0,10).map(v=>{const wrong=shuffle(w.vocab.filter(x=>x.en!==v.en)).slice(0,3).map(x=>x.ja);return{kind:"v",q:v.en,a:v.ja,opts:shuffle([v.ja,...wrong])}});
  const sp=x=>String(x||"").replace(/([।.?!,])/g," $1").split(/\s+/).filter(Boolean);
  const sq=shuffle(w.sentences).slice(0,5).map(s=>{const h=sp(s.en),r=sp(s.rom);return{kind:"s",q:s.ja,a:s.en,tiles:shuffle(h.map((t,k)=>({t,r:r.length===h.length?r[k]:""})))}});
  const tileH=x=>{const m=S.settings.script||"both";return m==="rom"&&x.r?`<span class="hi-rom">${esc(x.r)}</span>`:esc(x.t)+(m==="both"&&x.r?`<small>${esc(x.r)}</small>`:"")};
  const Q=[...vq,...sq];let i=0,score=0,picked=[],answered=false;
  const norm=s=>normHi(s).replace(/[^\p{L}\p{M}\p{N}' ]/gu,"").replace(/\s+/g," ").trim();
  function draw(body){
    if(i>=Q.length){const pts=Math.round(score/Q.length*100);S.tests[w.week]=Math.max(S.tests[w.week]||0,pts);save();
      body.innerHTML=`<div class="stack">${pic(pts>=100&&IMG_HAVE.has("aki-medal")?"aki-medal":pts>=80?"aki-cheer":"aki-think","empty-img","")}<div class="eyebrow">Week ${w.week} 週テスト</div><h2 class="mono" style="font-size:44px">${pts}<span style="font-size:18px">点</span></h2><p>${pts>=80?"合格です。この調子で次の週へ。":"80点未満の週は、復習カードと瞬間作文をもう一度回してから進むのがおすすめです。"}</p>${finishBtn()}</div>`;bindFinish(body,done);return}
    const q=Q[i];
    let h=`<div class="stack"><div class="spread"><span class="small muted mono">${i+1} / ${Q.length}</span><span class="small muted mono">${score}問正解</span></div><div class="progress"><span style="width:${i/Q.length*100}%"></span></div>`;
    if(q.kind==="v"){h+=`<div class="flash" style="min-height:140px"><div class="word">${tg(q.q)}</div>${spkBtn(q.q)}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${answered?(o===q.a?"ok":picked[0]===k?"ng":""):""}" data-o="${k}">${esc(o)}</button>`).join("")}</div>`}
    else{h+=`<div class="card"><div class="eyebrow">並べ替え</div><p style="font-size:17px;font-weight:700">${esc(q.q)}</p></div>
      <div class="answer en">${picked.map((k,j)=>`<button class="tile" data-un="${j}">${tileH(q.tiles[k])}</button>`).join("")}</div>
      <div class="tiles en">${q.tiles.map((t,k)=>`<button class="tile ${picked.includes(k)?"used":""}" data-t="${k}" ${picked.includes(k)?"disabled":""}>${tileH(t)}</button>`).join("")}</div>
      ${answered?`<div class="ai"><b>${norm(picked.map(k=>q.tiles[k].t).join(" "))===norm(q.a)?"正解":"正解は"}</b>　<span class="en">${tg(q.a)}</span></div>`:`<div><button class="btn primary" id="judge" ${picked.length<q.tiles.length?"disabled":""}>答え合わせ</button></div>`}`}
    if(answered)h+=`<div><button class="btn primary" id="next">次へ →</button></div>`;
    body.innerHTML=h+"</div>";
    body.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(answered)return;picked=[+b.dataset.o];answered=true;if(q.opts[picked[0]]===q.a)score++;draw(body)});
    body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(answered)return;picked.push(+b.dataset.t);draw(body)});
    body.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{if(answered)return;picked.splice(+b.dataset.un,1);draw(body)});
    const jg=body.querySelector("#judge");if(jg)jg.onclick=()=>{answered=true;if(norm(picked.map(k=>q.tiles[k].t).join(" "))===norm(q.a))score++;speak(q.a);draw(body)};
    const nx=body.querySelector("#next");if(nx)nx.onclick=()=>{i++;picked=[];answered=false;draw(body)};
  }
  openLesson("週テスト",`W${w.week}`,"",draw)}

function lessonRoleplay(w,done){
  const partner=(w.dialogue.lines.find(l=>l.s!=="A")||{}).name||"Raj";
  let msgs=[],busy=false,ended=false;
  const setup=`You are ${partner}, a friendly person from India (Delhi), talking with Akihiro, a Japanese man who runs an acupuncture and bone-setting clinic in Ozu, Ehime, and has business partners and friends in India. Akihiro is a beginner learning Hindi (CEFR ${w.cefr}).\nScene: ${w.scene}. This week's topic: ${w.title} (${w.grammar.title}).\nRules: Speak simple, natural Hindi at ${w.cefr} level and use आप. For every line, write the Hindi in Devanagari, then the romanization in parentheses, then a short Japanese translation on the next line. Keep each reply to 1-2 short sentences. Ask exactly one question each turn so Akihiro has to answer. Naturally use words like: ${w.vocab.slice(0,8).map(v=>v.en+" ("+romOf(v.en)+")").join(", ")}. Do not correct mistakes during the conversation. Akihiro may answer in Devanagari or romanized Hindi. If he writes Japanese, tell him the Hindi way to say it (Devanagari + romanization) and continue.\nStart the conversation now with your first line.`;
  function draw(body){
    body.innerHTML=`<div class="stack"><div class="card"><div class="eyebrow">今日のタスク</div><p style="font-weight:700">${esc(w.speaking)}</p>
      <p class="small muted" style="margin-top:6px">${SAMPLE?`相手は ${esc(partner)} さん。ヒンディー語（ローマ字でもOK）で返事を書くか、キーボードのマイクで話して入力します。6往復ほど続けたら「終わってフィードバック」。`:`Claude アプリが ${esc(partner)} さんの役をして、ヒンディー語（ローマ字と日本語訳つき）で話しかけてくれます。Claude アプリの<b>音声モード</b>で話すと、本当の会話の練習になります。6往復ほど話したら「終わり」と言うと、日本語でフィードバックがもらえます。`}</p></div>
     ${SAMPLE?"":`<div id="rpbridge"></div>`}
     ${SAMPLE?`<div class="chat" id="chat">${msgs.slice(1).map((m,k)=>m.role==="assistant"?`<div class="bub ai2">${partnerPic(partner,"avatar")}<span class="en">${esc(m.content)}</span><div class="row">${spkBtn(m.content)}</div></div>`:m.fb?"":`<div class="bub me en">${esc(m.content)}</div>`).join("")}</div>
      <div id="fbout"></div>
      ${ended?"":msgs.length?`<textarea id="say" style="min-height:80px" placeholder="ヒンディー語で返事（ローマ字でも、わからなければ日本語でもOK）"></textarea><div class="row"><button class="btn accent" id="send" ${busy?"disabled":""}>送る</button><button class="btn" id="end" ${busy||msgs.length<5?"disabled":""}>終わってフィードバック</button></div>`
        :`<div><button class="btn accent" id="start">会話を始める</button></div>`}`:""}
     ${finishBtn()}</div>`;
    bindFinish(body,done);
    const rb=body.querySelector("#rpbridge");if(rb)claudeBridge(rb,setup.replace("Start the conversation now with your first line.","When Akihiro says finish or 終わり, stop the role-play and give feedback in simple Japanese: 1) good points (2 lines), 2) up to 4 of his sentences rewritten as natural Hindi (Devanagari + romanization) with a one-line reason, 3) three useful phrases for next time (Devanagari + romanization + Japanese).\nStart the conversation now with your first line."),{title:"Claude アプリでヒンディー語の会話",noPaste:true});
    const stt=body.querySelector("#start");if(stt)stt.onclick=()=>turn(body,setup);
    const sd=body.querySelector("#send");if(sd)sd.onclick=()=>{const t=body.querySelector("#say").value.trim();if(t)turn(body,t)};
    const en=body.querySelector("#end");if(en)en.onclick=()=>feedback(body);
  }
  async function turn(body,text){if(busy)return;busy=true;msgs.push({role:"user",content:text});msgs.push({role:"assistant",content:"…"});draw(body);
    const bubs=()=>body.querySelectorAll(".bub.ai2 .en");
    try{const r=await SAMPLE(msgs.slice(0,-1),{cache:false,modelTier:"quick",onText:({text})=>{const b=bubs();if(b.length)b[b.length-1].textContent=text}});
      msgs[msgs.length-1].content=r.text.trim();busy=false;draw(body);speak(r.text.trim())}
    catch(e){msgs.splice(-2,2);busy=false;draw(body);toast(e&&e.code==="rate_limited"?"少し時間をおいてください":"AIにつながりませんでした")}}
  async function feedback(body){ended=true;draw(body);
    const conv=msgs.slice(1).map(m=>(m.role==="user"?"Akihiro: ":partner+": ")+m.content).join("\n");
    await askAI(`あなたは日本人にヒンディー語を教える講師です。日本人学習者 Akihiro（CEFR ${w.cefr}）が、ヒンディー語の会話練習をしました。今週のテーマは「${w.title}」。\n\n会話：\n${conv}\n\nやさしい日本語で次の形で答えてください。ヒンディー語には必ずローマ字を添えてください。\n## よかった点\n（2行以内）\n## 直すともっと良くなる文\n- Akihiro の文 → 自然なヒンディー語（ローマ字）：ひとこと理由（最大4つ）\n## 次の会話で使いたいフレーズ\n- ヒンディー語（ローマ字・日本語訳）を3つ\n## 今のレベルの目安\n（1行）`,body.querySelector("#fbout"))}
  openLesson("AIとヒンディー語会話",`W${w.week}`,"",draw)}

function notePrompt(m,cefr){
  return `あなたは日本人にヒンディー語を教える講師です。生徒は岩田章弘さん（日本の愛媛県大洲市の鍼灸整骨院の院長。インドに取引先や仲間・友人がいて、ヒンディー語で関係を深めたい）。ヒンディー語はゼロから学び中で、今のレベルは CEFR ${cefr} です（ビジネスの話は英語で行っています）。
岩田さんがインドの方と実際にした会話の記録（日本語のメモ、ヒンディー語・ローマ字ヒンディー語・英語のチャット、またはスクリーンショット）を渡します。これを整理して、次の会話でそのまま使えるヒンディー語の練習教材を作ってください。

日付：${m.date}／相手：${m.partner||"不明"}／方法：${m.channel}
--- 記録ここから ---
${m.raw||"（スクリーンショットを見てください）"}
--- 記録ここまで ---

作り方：
- 岩田さんが「次に同じ相手と話すとき」に使えるヒンディー語の文を優先。日本語や英語のメモしかない部分は、岩田さんが言いたかったことを自然でやさしいヒンディー語にする。
- 相手が使った表現で、岩田さんが知っておくべきもの（ヒングリッシュ、जी・यार・अच्छा・चलो などの言い方も）は意味と使い方を説明する。
- ヒンディー語は ${cefr} 〜1段上のレベルで、短く、相手に失礼のない自然な言い方（基本は आप）に。
- すべてのヒンディー語はデーヴァナーガリー（hi）で書き、ローマ字（rom）を付ける。ローマ字は発音どおりで、長母音 ā ī ū、そり舌音 ṭ ḍ ṛ、鼻音化は ṁ（hūṁ, maiṁ）。hi と rom はスペースで区切った語の数をそろえる。
- 岩田さん本人のヒンディー語（Me: / 私: / Akihiro: などの行、またはスクショの自分側）に誤りや不自然な点があれば fixes に入れる。なければ空配列。
- 電話番号・メールアドレス・住所などの個人情報は教材に入れない。
- 説明はやさしい日本語で。

次の形の JSON だけを返してください（キー名は厳守）：
{"title":"会話の内容を表す短い日本語（20字以内）","summary":"会話の要約（日本語2〜3文）","topics":["話題を短く3つまで"],
"sentences":[{"hi":"次の会話で使えるヒンディー語","rom":"ローマ字","ja":"日本語訳","note":"使う場面やコツ（日本語1文）"}],
"grammar":[{"title":"文法・型の名前","explain":"日本語2文以内の説明","hi":"この会話に合わせた例文","rom":"ローマ字","ja":"例文の訳"}],
"vocab":[{"hi":"単語・フレーズ","rom":"ローマ字","ja":"意味","ex":"この会話に合わせた例文","exRom":"例文のローマ字","exJa":"例文の訳"}],
"fixes":[{"original":"岩田さんが実際に書いた・言ったヒンディー語","improved":"自然なヒンディー語（デーヴァナーガリー）","improvedRom":"そのローマ字","why":"日本語1文の理由"}],
"dialogue":[{"s":"A","name":"Akihiro","hi":"岩田さんのセリフ（自然で正しいヒンディー語に直したもの）","rom":"ローマ字","ja":"日本語訳"},{"s":"B","name":"相手の名前","hi":"相手のセリフ","rom":"ローマ字","ja":"日本語訳"}]}
dialogue は「練習用の会話」です。実際の会話の流れと内容はそのままに、岩田さんのセリフは自然で正しいヒンディー語に直し、相手のセリフは聞き取りやすく整えます。岩田さんは s:"A"、相手は s:"B"。日本語のメモしかない場合は、メモの内容から自然な会話を作ります。1行は1〜2文。
件数：sentences 6〜10、grammar 2〜3、vocab 6〜12、fixes 0〜5、dialogue 6〜16行。`}
function cleanResult(r){r=r&&typeof r==="object"?r:{};
  const fixHi=a=>Array.isArray(a)?a.map(x=>{if(x&&typeof x==="object"){if(typeof x.hi==="string"&&!x.en)x.en=x.hi;normItem(x)}return x}):[];
  const arr=(a,keys)=>fixHi(a).filter(x=>x&&keys.every(k=>typeof x[k]==="string"&&x[k].trim())).slice(0,15);
  const keep=x=>{const o={};Object.keys(x).forEach(k=>{if(typeof x[k]==="string")o[k]=x[k]});return o};
  return{title:String(r.title||"会話").slice(0,40),summary:String(r.summary||""),topics:Array.isArray(r.topics)?r.topics.map(String).slice(0,3):[],
    sentences:arr(r.sentences,["en","ja"]).map(keep),grammar:arr(r.grammar,["title","en"]).map(keep),vocab:arr(r.vocab,["en","ja"]).map(keep),fixes:arr(r.fixes,["original","improved"]).map(keep),
    dialogue:fixHi(r.dialogue).filter(x=>x&&typeof x.en==="string"&&x.en.trim()).slice(0,24).map(x=>({s:x.s==="A"?"A":"B",name:String(x.name||(x.s==="A"?"Akihiro":"Partner")),en:x.en.trim(),rom:String(x.rom||""),ja:String(x.ja||"")}))}}
function showPicker(body,out,m,r){
  const sec=(title,list,type,fmt)=>list.length?`<div class="card"><div class="spread"><h3>${title}</h3><span class="small muted">${list.length}</span></div>${list.map((x,i)=>`<label class="pick"><input type="checkbox" checked data-pick="${type}-${i}"><span>${fmt(x)}</span>${spkBtn(type==="f"?x.improved:x.en)}</label>`).join("")}</div>`:"";
  out.innerHTML=`<div class="stack"><div class="ai"><b>${esc(r.title)}</b><p>${esc(r.summary)}</p>${r.topics.length?`<div class="row" style="margin-top:6px">${r.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}</div>
   <p class="small muted">練習に入れたいものにチェックを入れたまま保存してください。いらないものはチェックを外します。</p>
   ${r.dialogue.length?`<div class="card"><div class="spread"><h3>練習用の会話（自然なヒンディー語に直した版）</h3><span class="small muted">${r.dialogue.length}行</span></div>${r.dialogue.map(l=>`<div class="dl ${l.s==="A"?"mine":""}"><span class="who">${esc(l.name)}</span><div class="t"><span class="en">${tg(l.en)}</span><span class="ja">${esc(l.ja)}</span></div>${spkBtn(l.en)}</div>`).join("")}</div>`:""}
   ${sec("使える文（瞬間作文）",r.sentences,"s",x=>`<span class="en">${tg(x.en)}</span><span class="small">${esc(x.ja)}</span>${x.note?`<span class="small muted" style="display:block">${esc(x.note)}</span>`:""}`)}
   ${sec("自分のヒンディー語をもっと自然に",r.fixes,"f",x=>`<span class="small" style="text-decoration:line-through;color:var(--muted)">${esc(x.original)}</span><span class="en" style="color:var(--green);font-weight:700">${tg(x.improved)}</span><span class="small muted">${esc(x.why||"")}</span>`)}
   ${sec("文法・型",r.grammar,"g",x=>`<b class="small">${esc(x.title)}</b><span class="small muted" style="display:block">${esc(x.explain||"")}</span><span class="en">${tg(x.en)}</span><span class="small">${esc(x.ja||"")}</span>`)}
   ${sec("単語・フレーズ",r.vocab,"v",x=>`<span class="en"><b>${tg(x.en)}</b>　${esc(x.ja)}</span>${x.ex?`<span class="small muted">${tg(x.ex)}</span>`:""}`)}
   <div class="row"><button class="btn primary" id="n-save">保存して練習カードに追加</button></div></div>`;
  out.querySelector("#n-save").onclick=()=>{const keep=t=>(i)=>{const c=out.querySelector(`[data-pick="${t}-${i}"]`);return !c||c.checked};
    saveNewNote(Object.assign({},m,{title:r.title,summary:r.summary,topics:r.topics,dialogue:r.dialogue,sentences:r.sentences.filter((_,i)=>keep("s")(i)),fixes:r.fixes.filter((_,i)=>keep("f")(i)),grammar:r.grammar.filter((_,i)=>keep("g")(i)),vocab:r.vocab.filter((_,i)=>keep("v")(i))}))};
  out.scrollIntoView({behavior:"smooth",block:"start"})}
function saveNewNote(n,opt){opt=opt||{};
  n.kind="note";n.id=Date.now().toString(36);n.createdAt=Date.now();ensurePerson(n.partner);
  NOTES.unshift(n);NOTES.sort((a,b)=>(b.date+b.createdAt)>(a.date+a.createdAt)?1:-1);saveNotesLocal();pushNote(n);
  noteKeys(n).forEach(k=>{if(!S.srs[k])S.srs[k]={b:0,d:today()}});if(!opt.quiet)logMinutes(10,"note");save();
  closeLesson();TAB="notes";render();
  if(opt.quiet){toast(`${n.partner} さんとの会話を記録しました（${n.minutes||0}分）`);return}
  toast(`保存しました（カード${noteCount(n)}枚）`);setTimeout(()=>openNote(n.id),300)}

const INTRO=[

/* ============ 話す練習（毎日10分）と、話した相手の記録 ============ */
const MINUTES=[5,10,15,20,30,45,60,90];
const TALK_TOPICS=[
 ["自己紹介","名前・出身・仕事を、何も見ずに言ってみましょう。","मेरा नाम आकिहिरो है।","merā nām Ākihiro hai."],
 ["今日の1日","今日どこにいて、何をしたか。知っている単語だけでOK。","आज मैं क्लिनिक में था।","āj maiṁ klinik meṁ thā."],
 ["家族","家族の人数や、だれが何をしているか。","मेरे परिवार में चार लोग हैं।","mere parivār meṁ chār log haiṁ."],
 ["好きな食べ物","日本とインドの好きな食べ物と飲み物。","मुझे चाय बहुत पसंद है।","mujhe chāy bahut pasand hai."],
 ["インドでしたいこと","次にインドへ行ったら、どこへ行って何をしたいか。","मैं दिल्ली जाना चाहता हूँ।","maiṁ Dillī jānā chāhtā hūṁ."],
 ["横浜と愛媛","生まれた町と、院がある町の紹介。","योकोहामा एक बड़ा शहर है।","Yokohāmā ek baṛā shahar hai."],
 ["数字と値段","身の回りの物の値段や、今の時刻を言う練習。","यह कितने का है?","yah kitne kā hai?"]];
TALK_TOPICS.forEach(t=>addRom(t[2],t[3]));
function people(){if(!Array.isArray(S.people))S.people=[];return S.people}
function ensurePerson(name){name=(name||"").trim();if(!name)return null;let p=people().find(x=>x.name===name);if(!p){p={name,org:"",memo:""};people().push(p)}return p}
function personStats(name){const ns=NOTES.filter(n=>n.partner===name);return{count:ns.length,minutes:ns.reduce((a,n)=>a+(+n.minutes||0),0),last:ns.map(n=>n.date).sort().slice(-1)[0]||""}}
function allPartners(){const s=new Set(people().map(p=>p.name));NOTES.forEach(n=>{if(n.partner)s.add(n.partner)});return [...s]}
function speakingMinutes(){return Object.values(S.log).reduce((a,l)=>a+(l.s||0),0)+NOTES.reduce((a,n)=>a+(+n.minutes||0),0)}
function speakTopic(w){
  if(S.day<=3&&w)return{ja:"今週のテーマ「"+w.title+"」",desc:w.speaking,task:true};
  if(S.day===4){const v=S.week<=8?0:1;return{ja:"自己紹介（"+INTRO[v].label+"）",desc:"原稿を見ずに、自己紹介を言ってみましょう。",hi:INTRO[v].lines[0].hi,intro:v}}
  const t=TALK_TOPICS[(S.week*7+S.day)%TALK_TOPICS.length];return{ja:t[0],desc:t[1],hi:t[2]}}
function speakPrompt(topic,partner,cefr){const p=partner?people().find(x=>x.name===partner):null;
  return `You are my Hindi speaking partner${partner?`, playing ${partner}`:""}, a friendly person from India${p&&(p.org||p.memo)?` (about ${partner}: ${[p.org,p.memo].filter(Boolean).join(". ")})`:""}. I am Akihiro Iwata, a Japanese man who runs an acupuncture clinic in Ozu, Ehime. I am a beginner learning Hindi (CEFR ${cefr}). I already speak some English, but please use Hindi.
Today's topic: ${topic.ja} — ${topic.desc}${topic.hi?` (for example: ${topic.hi} / ${romOf(topic.hi)})`:""}
Talk with me for about 10 minutes in very simple, slow Hindi, using आप. Say one short sentence and ask one question at a time. If I get stuck, give me a hint in Japanese and the Hindi words I need (with romanization). Do not correct my mistakes during the talk. If I say something in Japanese, tell me how to say it in Hindi and continue.
When I say "finish" or "終わり", stop and give feedback in simple Japanese: 1) good points (2 lines), 2) up to 4 of my sentences rewritten as natural Hindi (Devanagari + romanization) with a short reason, 3) three useful phrases for next time (Devanagari + romanization + Japanese).
Start now with a friendly greeting and your first question.`}
function lessonSpeak(w,done){
  const cefr=w?w.cefr:phaseOf(S.week).cefr;const topic=speakTopic(w);let left=600,timer=null,heard="";
  const partners=allPartners();
  openLesson("話す練習 10分",`W${S.week}`,()=>`<div class="stack">
   <div class="card stack" style="align-items:center;text-align:center">${pic("aki-talk","empty-img","")}
    <div class="eyebrow">Speaking time</div>
    <div class="mono" id="sp-clock" style="font-size:52px;font-weight:600;line-height:1">10:00</div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="sp-start">▶ スタート</button><button class="btn" id="sp-reset">リセット</button></div>
    <p class="small muted">10分間、ヒンディー語で口を動かし続けることが目標です。止まってもOK、日本語や英語が混ざってもOK。</p></div>
   <div class="card stack"><div class="eyebrow">今日のお題</div><h3>${esc(topic.ja)}</h3><p class="small">${esc(topic.desc)}</p>${topic.hi?`<div class="row" style="flex-wrap:nowrap">${spkBtn(topic.hi)}<span class="en" style="font-size:17px">${tg(topic.hi)}<span class="small muted" style="display:block">こんなふうに始めてみましょう</span></span></div>`:""}
    ${topic.intro!=null?`<div><button class="btn sm" id="sp-intro">自己紹介の原稿を開く</button></div>`:""}</div>
   <h3>やり方を1つ選ぶ</h3>
   <div class="card stack"><div class="mascot-side">${IMG_HAVE.has("aki-online")?pic("aki-online","",""):""}<b>① Claude アプリの音声モードで話す（おすすめ）</b></div>
    <p class="small muted">Claude がインドの方の役をして、やさしいヒンディー語でお題について質問してくれます。困ったら日本語で聞いてOK。最後に「終わり」と言うと、日本語でフィードバックがもらえます。</p>
    ${partners.length?`<label class="small" for="sp-partner">相手の役（記録した人から選べます）</label><select id="sp-partner"><option value="">インドの友人（おまかせ）</option>${partners.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`:""}
    ${SAMPLE?`<div><button class="btn accent" id="sp-inapp">このアプリの中でAIと話す（文字）</button></div>`:""}
    <div id="sp-bridge"></div></div>
   <div class="card stack"><b>② 今日インドの方と実際に話した</b><p class="small muted">ひとことでもヒンディー語を使ったら、それが今日の話す練習です。誰と何分話したかを記録しましょう。</p>
    <div><button class="btn" id="sp-real">話した記録をつける</button></div></div>
   <div class="card stack"><b>③ ひとりで話す</b><p class="small muted">お題について、次の順で話します。①結論を1文 → ②理由や具体例を2〜3文 → ③最後にもう一度まとめ。3回くり返すと、2回目からぐっと楽になります。</p>
    ${HAS_MIC?`<div><button class="btn" id="sp-mic">🎤 話したヒンディー語を文字で確かめる</button></div><div id="sp-heard"></div>`:`<p class="small muted">iPhone のボイスメモで録音して、聞き直すのもおすすめです。</p>`}</div>
   ${finishBtn("10分話した・完了")}</div>`,
  body=>{
    const clock=body.querySelector("#sp-clock"),st=body.querySelector("#sp-start");
    const show=()=>{clock.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")};
    st.onclick=()=>{if(timer){clearInterval(timer);timer=null;st.textContent="▶ 再開";return}
      st.textContent="❚❚ 一時停止";timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;st.textContent="▶ スタート";left=0;speak("समय पूरा हुआ। बहुत बढ़िया!");toast("10分たちました。おつかれさまでした")}},1000)};
    body.querySelector("#sp-reset").onclick=()=>{clearInterval(timer);timer=null;left=600;show();st.textContent="▶ スタート"};
    onClose=()=>{clearInterval(timer)};
    const ib=body.querySelector("#sp-intro");if(ib)ib.onclick=()=>openIntro(topic.intro);
    const drawBridge=()=>{const sel=body.querySelector("#sp-partner");claudeBridge(body.querySelector("#sp-bridge"),speakPrompt(topic,sel?sel.value:"",cefr),{title:"Claude アプリでヒンディー語を10分話す",noPaste:true})};
    drawBridge();const sel=body.querySelector("#sp-partner");if(sel)sel.onchange=drawBridge;
    const ia=body.querySelector("#sp-inapp");if(ia)ia.onclick=()=>{const nm=(sel&&sel.value)||"Raj";
      lessonRoleplay({week:S.week,cefr,scene:topic.desc,title:topic.ja,grammar:{title:w?w.grammar.title:"自由"},vocab:w?w.vocab:[],dialogue:{lines:[{s:"B",name:nm}]},speaking:topic.ja+"："+topic.desc},()=>{done()})};
    body.querySelector("#sp-real").onclick=()=>openQuickLog("",()=>done("speak-real"));
    const mc=body.querySelector("#sp-mic");if(mc)mc.onclick=async()=>{mc.disabled=true;mc.textContent="🎤 聞いています…";
      try{const t=await listenOnce();heard+=(heard?" ":"")+t;body.querySelector("#sp-heard").innerHTML=`<div class="ai"><div class="small muted">あなたが話したヒンディー語</div><p class="en" style="font-size:16.5px">${esc(heard||"（聞き取れませんでした）")}</p>${heard?`<div style="margin-top:6px"><button class="btn sm" id="sp-fix">AI に自然なヒンディー語にしてもらう</button></div><div id="sp-fixout"></div>`:""}</div>`;
        const fx=body.querySelector("#sp-fix");if(fx)fx.onclick=()=>askAI(`あなたはヒンディー語の講師です。日本人学習者（CEFR ${cefr}）が「${topic.ja}：${topic.desc}」というお題で話したヒンディー語（音声認識の文字起こし）です。\n\n${heard}\n\n言いたかったことを、同じレベルの自然なヒンディー語に直した全文（デーヴァナーガリーとローマ字）と、大事な直しを3つまで、やさしい日本語で教えてください。`,body.querySelector("#sp-fixout"))}
      catch(e){toast(e==="not-allowed"||e==="service-not-allowed"?"マイクの使用を許可してください（設定 → Safari → マイク）":"うまく聞き取れませんでした")}
      mc.disabled=false;mc.textContent="🎤 続けて話す"};
    bindFinish(body,done)})}

/* --- 話した記録だけ残す（AI なし・30秒） --- */
function openQuickLog(name,after){
  const partners=allPartners();
  openLesson("話した記録","",`<div class="stack">
   <p class="small muted">誰と、どうやって、何分くらい話したかを残します。話した内容はひとことでOK。</p>

      askAI(`あなたはヒンディー語の講師です。日本人学習者の岩田章弘さん（愛媛県大洲市の鍼灸整骨院の代表、ヒンディー語は CEFR ${w?w.cefr:phaseOf(S.week).cefr}）が、インドの ${name} さんと次にヒンディー語で話す準備を手伝ってください。\n${name} さんについて：${[p.org,p.memo].filter(Boolean).join("／")||"情報なし"}\nこれまでの会話：\n${hist}\n\n次の形で、ヒンディー語（デーヴァナーガリー・ローマ字）とやさしい日本語訳で答えてください。\n## 最初のあいさつと雑談（2文）\n## 前回の続きで聞くとよい質問（3つ）\n## 使えそうなフレーズ（5つ）\n## 気をつけること（1〜2行・日本語）`,body.querySelector("#pp-out"),{title:"Claude に準備を手伝ってもらう"})};
    body.querySelectorAll("[data-pnote]").forEach(b=>b.onclick=()=>openNote(b.dataset.pnote))})}

/* ============ iPhone と iPad の同期（合言葉方式・Supabase） ============ */
const SB_RPC="https://clfmhgnkwanhnbsjpyxc.supabase.co/rest/v1/rpc/";
const SB_KEY="sb_publishable_XFVzuu-ijKqT-pZmHkb95Q_ZI7DgL01";
const SYNCKEY="hindi52-sync-v1";
const SYNCPFX="hindi52:"; // 英語版と同じ表を使うので、合言葉に印を付けて記録を分ける
let syncing=false,syncAgain=false,syncTimer=null,syncState="";
function syncCfg(){try{return JSON.parse(localStorage.getItem(SYNCKEY)||"null")}catch(e){return null}}
function setSyncCfg(c){try{c?localStorage.setItem(SYNCKEY,JSON.stringify(c)):localStorage.removeItem(SYNCKEY)}catch(e){}}
async function rpc(fn,body){const r=await fetch(SB_RPC+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("http "+r.status);return r.json()}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const b=new Uint8Array(20);crypto.getRandomValues(b);let s="";b.forEach((x,i)=>{s+=A[x%32];if(i%5===4&&i<19)s+="-"});return s}
function normCode(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{5})(?=.)/g,"$1-")}
function scheduleSync(){if(IN_ARTIFACT||!syncCfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
function mergeRemote(d){if(!d||!d.state)return;const R=merge(d.state),L=S;
  const newer=(R.updatedAt||0)>(L.updatedAt||0)?R:L,older=newer===L?R:L;const out=Object.assign({},newer);
  out.srs=Object.assign({},L.srs);Object.entries(R.srs||{}).forEach(([k,c])=>{const a=out.srs[k];if(!a||c.d>a.d||(c.d===a.d&&c.b>a.b))out.srs[k]=c});
  out.log=Object.assign({},L.log);Object.entries(R.log||{}).forEach(([day,l])=>{const a=out.log[day];out.log[day]=!a?l:{m:Math.max(a.m||0,l.m||0),s:Math.max(a.s||0,l.s||0),t:(a.t||[]).length>=(l.t||[]).length?a.t:l.t}});
  out.tests=Object.assign({},L.tests);Object.entries(R.tests||{}).forEach(([w,p])=>{out.tests[w]=Math.max(out.tests[w]||0,p)});
  const uniq=(arr,key)=>{const m=new Map();arr.forEach(x=>{if(x)m.set(key(x),x)});return [...m.values()]};
  out.scores=uniq([...(older.scores||[]),...(newer.scores||[])],x=>x.date+"|"+x.test+"|"+x.result);
  out.diary=uniq([...(older.diary||[]),...(newer.diary||[])],x=>x.date).sort((a,b)=>a.date<b.date?-1:1);
  const pm=new Map();[...(older.people||[]),...(newer.people||[])].forEach(p=>{if(!p||!p.name)return;const o=pm.get(p.name)||{};pm.set(p.name,{name:p.name,org:p.org||o.org||"",memo:p.memo||o.memo||""})});out.people=[...pm.values()];
  out.deletedNotes=[...new Set([...(L.deletedNotes||[]),...(R.deletedNotes||[])])];
  if(L.doneToday&&R.doneToday&&L.doneToday.date===R.doneToday.date&&L.week===R.week&&L.day===R.day)out.doneToday={date:L.doneToday.date,tasks:[...new Set([...(L.doneToday.tasks||[]),...(R.doneToday.tasks||[])])]};
  out.updatedAt=Math.max(L.updatedAt||0,R.updatedAt||0);S=out;
  const del=new Set(S.deletedNotes);const nm=new Map();[...(d.notes||[]),...NOTES].forEach(n=>{if(n&&n.id&&!del.has(n.id))nm.set(n.id,n)});
  NOTES=[...nm.values()].sort((a,b)=>(b.date+b.createdAt)>(a.date+a.createdAt)?1:-1);
  lsSet(S);try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}}
async function syncNow(){const c=syncCfg();if(!c||IN_ARTIFACT)return;if(syncing){syncAgain=true;return}syncing=true;setSyncState("sync");
  const before=JSON.stringify([S.week,S.day,NOTES.length,Object.keys(S.srs).length,S.doneToday]);
  try{let done=false;for(let i=0;i<3&&!done;i++){
      const rows=await rpc("eigo52_pull",{p_code:SYNCPFX+c.code});const remote=rows&&rows[0];
      if(remote)mergeRemote(remote.data);
      const r=await rpc("eigo52_push",{p_code:SYNCPFX+c.code,p_data:{app:"hindi52",v:1,state:S,notes:NOTES},p_base:remote?remote.updated_at:null});
      if(r&&r.ok){setSyncCfg(Object.assign(syncCfg()||c,{last:Date.now()}));done=true}}
    setSyncState(done?"ok":"ng")}
  catch(e){setSyncState("ng")}
  syncing=false;
  const after=JSON.stringify([S.week,S.day,NOTES.length,Object.keys(S.srs).length,S.doneToday]);
  if(before!==after&&$("#lesson").hidden)render();
  if(syncAgain){syncAgain=false;scheduleSync()}}
function setSyncState(s){syncState=s;const el=document.getElementById("syncchip");if(el)el.innerHTML=syncChipText()}
function syncChipText(){const c=syncCfg();if(!c)return"";
  if(syncState==="sync")return"☁ 同期中…";if(syncState==="ng")return"☁ 同期できませんでした";
  return c.last?"☁ 同期 "+new Date(c.last).toTimeString().slice(0,5):"☁ つながっています"}
function syncCard(){if(IN_ARTIFACT)return"";const c=syncCfg();
  if(!c)return `<div class="card stack" id="synccard"><div class="mascot-side">${pic("sync-devices","","")}<h3>iPhone と iPad をつなぐ</h3></div>
   <p class="small">「合言葉」で2台の記録（進み具合・カード・会話ノート・話した相手）を自動でそろえます。ログインは不要です。英語52週の合言葉とは別に作ってください。</p>
   <p class="small"><b>1台目（例：iPhone）</b>で「合言葉を作る」→ 表示された合言葉を <b>2台目（iPad）</b>の「合言葉を入れてつなぐ」に入れます。</p>
   <div><button class="btn accent" data-act="syncnew">この端末で合言葉を作る</button></div>
   <label class="small" for="sync-in">合言葉を入れてつなぐ（2台目）</label>
   <input type="text" id="sync-in" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" style="font-family:var(--f-mono)">
   <div><button class="btn" data-act="syncjoin">つなぐ</button></div>
   <p class="small muted">合言葉を知っている人は記録を見られるので、人には教えないでください。</p></div>`;
  return `<div class="card stack" id="synccard"><div class="spread"><h3>iPhone と iPad をつなぐ</h3><span class="chip g" id="syncchip">${syncChipText()}</span></div>
   <p class="small">この端末はつながっています。もう1台に、この合言葉を入れてください。</p>
   <div class="mono" style="font-size:20px;font-weight:600;letter-spacing:.06em;overflow-wrap:anywhere">${esc(c.code)}</div>
   <div class="row"><button class="btn sm" data-act="synccopy">合言葉をコピー</button>${navigator.share?`<button class="btn sm" data-act="syncshare">AirDrop などで送る</button>`:""}<button class="btn sm" data-act="syncnow">今すぐ同期</button></div>
   <textarea id="sync-code-src" readonly hidden style="min-height:40px">${esc(c.code)}</textarea>
   <div><button class="btn sm ghost" data-act="syncoff" id="syncoffbtn">この端末の同期をやめる</button></div></div>`}
async function syncJoin(code){code=normCode(code);if(code.replace(/-/g,"").length<16){toast("合言葉が短すぎます");return}
  try{const rows=await rpc("eigo52_pull",{p_code:SYNCPFX+code});if(!rows||!rows[0]){toast("その合言葉は見つかりません。1台目の合言葉を確かめてください");return}
    setSyncCfg({code});await syncNow();render();toast("つながりました。記録をそろえました")}
  catch(e){toast("つながりませんでした。インターネット接続を確かめてください")}}

/* ============ イベント ============ */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){e.stopPropagation();stopSpeak();speak(s.dataset.say);return}
  const tb=e.target.closest(".nav [data-tab]");if(tb){TAB=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const tk=e.target.closest("#app [data-task]");if(tk){const i=+tk.dataset.task;runTask(todayTasks()[i],W(S.week),i);return}
  const pe=e.target.closest("#app [data-person]");if(pe){openPerson(pe.dataset.person);return}
  const nt=e.target.closest("#app [data-note]");if(nt){openNote(nt.dataset.note);return}
  const wk=e.target.closest("#app [data-week]");if(wk){openWeek(+wk.dataset.week);return}
  const a=e.target.closest("#app [data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="nextday"){if(S.day<7)S.day++;else if(S.week<52){S.week++;S.day=1}S.doneToday={date:today(),tasks:[]};save();render();window.scrollTo(0,0);toast(`Week ${S.week} の ${S.day}日目へ`)}
  else if(act==="addscore"){const r=$("#sc-res").value.trim();if(!r){toast("結果を入力してください");return}S.scores.push({date:$("#sc-date").value,test:$("#sc-test").value,result:r});save();render();toast("記録しました")}
  else if(act==="newnote"){openNoteEditor()}
  else if(act==="quickpaste"){pasteInto($("#quick-raw"))}
  else if(act==="quickgo"){const v=$("#quick-raw").value.trim();if(!v){toast("会話を貼り付けてください");return}openNoteEditor("",v);$("#quick-raw").value=""}
  else if(act==="intro"){openIntro(0)}
  else if(act==="quicklog"){openQuickLog("")}
  else if(act==="notereview"){lessonCards(dueNoteKeys().slice(0,30).map(cardFromKey).filter(Boolean),"ノートの復習",()=>{logMinutes(10,"note");save();closeLesson()},true)}
  else if(act==="backup"||act==="backupcopy"){const data=JSON.stringify({app:"hindi52",v:1,savedAt:new Date().toISOString(),state:S,notes:NOTES});
    if(act==="backup"){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="hindi52-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast("保存しました（ファイルAppの「ダウンロード」）")}catch(e){toast("保存できませんでした。コピーを使ってください")}}
    else copyText(data,$("#bk-text"))}
  else if(act==="restore"){restoreBackup($("#bk-paste").value)}
  else if(act==="syncnew"){setSyncCfg({code:genCode()});syncNow().then(()=>{render();toast("合言葉を作りました。もう1台に入れてください")});render()}
  else if(act==="syncjoin"){syncJoin($("#sync-in").value)}
  else if(act==="synccopy"){copyText(syncCfg().code,$("#sync-code-src"))}
  else if(act==="syncshare"){navigator.share({title:"ヒンディー語52週の合言葉",text:syncCfg().code}).catch(()=>{})}
  else if(act==="syncnow"){syncNow().then(()=>{render();toast(syncState==="ok"?"同期しました":"同期できませんでした")})}
  else if(act==="syncoff"){const b=$("#syncoffbtn");if(!b.dataset.ok){b.dataset.ok=1;b.textContent="もう一度押すと、この端末の同期をやめます（記録は残ります）";return}setSyncCfg(null);render();toast("この端末の同期をやめました")}
  else if(act==="testvoice"){speak("नमस्ते, मैं आकिहिरो हूँ। आपसे मिलकर खुशी हुई।")}
  else if(act==="cyclescript"){const o=["both","hi","rom"];S.settings.script=o[(o.indexOf(S.settings.script||"both")+1)%3];save();render();toast("表示："+SCRIPTNAME[S.settings.script])}
});
document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input[type=text]"))setTimeout(()=>{try{e.target.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}},350)});
function restoreBackup(txt){const d=parseJSONLoose(txt);if(!d||d.app!=="hindi52"||!d.state){toast(d&&d.app==="eigo52"?"これは英語52週のバックアップです":"バックアップの形が違います");return}
  S=merge(d.state);NOTES=Array.isArray(d.notes)?d.notes:[];save();saveNotesLocal();NOTES.forEach(n=>pushNote(n));render();toast("バックアップを読み込みました")}
document.addEventListener("change",e=>{
  if(e.target.id==="bk-file"&&e.target.files[0]){const r=new FileReader();r.onload=()=>restoreBackup(String(r.result||""));r.readAsText(e.target.files[0])}
  if(e.target.id==="set-script"){S.settings.script=e.target.value;save();render()}
  if(e.target.id==="set-voice"){const [nm,uri]=e.target.value.split("|");S.settings.voiceName=nm||"";S.settings.voiceURI=uri||"";save();render();speak("नमस्ते, मैं आकिहिरो हूँ।")}
  if(e.target.id==="set-rate"){S.settings.rate=+e.target.value;save()}
  if(e.target.id==="set-start"&&e.target.value){S.startDate=e.target.value;save()}
});
const _rg=render;render=function(){_rg();const a=$("#set-script");if(a)a.value=S.settings.script||"both";const r=$("#set-rate");if(r)r.value=String(S.settings.rate)};
initStore().then(()=>{if(!IN_ARTIFACT&&syncCfg()){syncNow();setInterval(()=>{if(document.visibilityState==="visible")syncNow()},120000)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!IN_ARTIFACT&&syncCfg())syncNow()});
</script>
