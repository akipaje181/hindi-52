/* ============ 会話のキャッチボール（答える → ひとこと足す → 聞き返す） ============
   教材は data/catch.js（window.CATCH。lv1〜4 を期に合わせて出す）。カードキー c<id> */
const CT=()=>window.CATCH||[];
const CT_PART={a:["①","答える","#3D7BFF"],add:["②","ひとこと足す","#18B487"],back:["③","聞き返す","#FF7A45"]};
const ctFind=id=>CT().find(c=>c.id===+id);
const ctVoice=c=>FEMALE_RE.test(c.who||"")?"swara":"madhur";
const ctFull=c=>c.ans.map(a=>a.en).join(" ");
function catchCard(id){const c=ctFind(id);if(!c)return null;return{key:"c"+id,type:"s",item:{q:"相手："+c.q,hint:c.qja+"　→ 答える＋ひとこと足す＋聞き返す",en:ctFull(c),ja:c.ans.map(a=>a.ja).join(""),note:c.tip},week:S.week,noteLabel:"キャッチボール"}}
function catchPick(n){const lv=phaseOf(S.week).n,pool=CT().filter(c=>c.lv<=lv),t=today();
  const due=pool.filter(c=>S.srs["c"+c.id]&&S.srs["c"+c.id].d<=t);
  const fresh=pool.filter(c=>!S.srs["c"+c.id]).sort((a,b)=>(b.lv===lv)-(a.lv===lv)||a.id-b.id);
  return [...shuffle(due).slice(0,2),...fresh].slice(0,n||5)}
function catchRow(){if(!CT().length)return"";const n=CT().filter(c=>S.srs["c"+c.id]&&S.srs["c"+c.id].b>=2).length;
  return `<button class="catchbtn" data-act="catch"><span class="ic">🏓</span><span><b>会話のキャッチボール</b><small>答える → ひとこと足す → 聞き返す、を5問。続けられた ${n}/${CT().length}</small></span><span class="min">→</span></button>`}
// 聞き取った答えを、3つの型にそって大まかに見る
function catchJudge(heard){const w=heard.trim().split(/\s+/).filter(Boolean);const tail=w.slice(-8).join(" ").toLowerCase();
  const back=/\?\s*$/.test(heard)||/(क्या|कैसे|कैसी|कहाँ|कहां|कब|कौन|क्यों|कितन|और आप|आपका|आपकी|आपके|आपको|kya|kaise|kaisi|kahan|kab|kaun|kyon|kitn|aur aap|aapk)/.test(tail);
  return{answer:w.length>=2,add:w.length>=(back?9:7),back}}
function lessonCatch(done){let q=catchPick(5),i=0,phase=0,heard=null,cnt=[0,0,0];
  openLesson("会話のキャッチボール","",()=>"",body=>{
    function draw(){
      if(!q.length){body.innerHTML=`<div class="stack"><p>今の期の質問は全部練習しました。</p>${finishBtn("閉じる")}</div>`;bindFinish(body,done||closeLesson);return}
      if(i>=q.length){logMinutes(Math.max(3,Math.round(q.length*1.5)),"speak");save();
        body.innerHTML=`<div class="stack" style="text-align:center">${pic(cnt[2]>=q.length-1?"aki-cheer":"aki-talk","dc-img","")}<h2>${cnt[2]}/${q.length} 往復つづきました</h2>
         <p class="small">「答える → ひとこと足す → 聞き返す」が毎回言えると、相手から次の話が返ってきて、会話が続きます。</p>
         <div class="row" style="justify-content:center"><button class="btn primary" id="c-more">もう5問</button><button class="btn" id="c-hk">聞き返しの表現を練習</button></div>${finishBtn(done?"完了":"閉じる")}</div>`;
        bindFinish(body,done||closeLesson);
        body.querySelector("#c-more").onclick=()=>{q=catchPick(5);i=0;phase=0;heard=null;cnt=[0,0,0];draw()};
        body.querySelector("#c-hk").onclick=()=>{closeLesson();setTimeout(()=>openHitokoto("kiki"),60)};return}
      const c=q[i];const j=heard!=null?catchJudge(heard):null;
      body.innerHTML=`<div class="stack"><div class="spread"><span class="small muted mono">${i+1} / ${q.length}</span><span class="chip">${esc(c.topic)}・レベル${c.lv}</span></div>
       <div class="progress"><span style="width:${i/q.length*100}%"></span></div>
       <div class="hk-partner">${partnerPic(c.who,"avatar")}<div class="t"><small class="muted">${esc(c.who)}</small><span class="en" style="font-size:18px">${tg(c.q)}</span><small class="muted ${phase===0?"blur":""}" id="c-qja">${esc(c.qja)}</small></div>${spkBtn(c.q,ctVoice(c))}</div>
       <div class="ctype">${Object.keys(CT_PART).map(k=>`<span style="--c:${CT_PART[k][2]}">${CT_PART[k][0]} ${CT_PART[k][1]}</span>`).join("<i>→</i>")}</div>
       ${phase===0?`<p class="small muted" style="text-align:center">返事を3つの型で、声に出して言ってみましょう。最後は必ず質問で返します。</p>
         ${HAS_MIC?`<button class="btn accent" id="c-mic" style="justify-content:center;width:100%">🎤 話して答える</button>`:""}
         <button class="btn ${HAS_MIC?"":"primary"}" id="c-show" style="justify-content:center;width:100%">言った・手本を見る</button>
         <button class="btn sm ghost" id="c-ja" style="align-self:center">質問の日本語を見る</button>`
       :`${heard!=null?`<div class="ai"><div class="small muted">あなたの返事（聞き取り）</div><div class="en" style="font-size:17px">${esc(heard||"（聞き取れませんでした）")}</div>
           <div class="cjudge">${[["answer","答えた"],["add","ひとこと足した"],["back","聞き返した"]].map(([k,l])=>`<span class="${j[k]?"ok":"ng"}">${j[k]?"✓":"・"} ${l}</span>`).join("")}</div>${!j.back?`<p class="small" style="margin-top:4px">最後に <b class="hi">और आप?</b>（アウル アープ？＝あなたは？）などの質問で返すと、会話が続きます。</p>`:""}</div>`:""}
         <div class="card stack"><div class="spread"><b>手本の返事</b><button class="btn sm" id="c-play">▶ 会話で聞く</button></div>
          ${c.ans.map(a=>{const p=CT_PART[a.t];return `<div class="cline" style="--c:${p[2]}"><span class="lab">${p[0]} ${p[1]}</span><div class="exline">${spkBtn(a.en,"madhur")}<div class="t"><span class="en">${tg(a.en)}</span><span class="small muted">${esc(a.ja)}</span></div></div></div>`}).join("")}</div>
         ${c.tip?`<div class="tip">💡 ${esc(c.tip)}</div>`:""}
         <div class="rate"><button class="r0" data-r="0">止まった<small>もう一度</small></button><button class="r1" data-r="1">少し言えた<small>明日</small></button><button class="r2" data-r="2">続けられた<small>先へ延ばす</small></button></div>`}
      </div>`;
      if(phase===0&&heard==null)speak(c.q,undefined,ctVoice(c));
      const q2=s=>body.querySelector(s);
      if(q2("#c-ja"))q2("#c-ja").onclick=()=>q2("#c-qja").classList.remove("blur");
      if(q2("#c-show"))q2("#c-show").onclick=()=>{phase=1;draw()};
      if(q2("#c-mic"))q2("#c-mic").onclick=async()=>{const b=q2("#c-mic");b.disabled=true;b.textContent="🎤 聞いています…返事をヒンディー語で";
        try{heard=await listenOnce()}catch(e){toast(e==="not-allowed"||e==="service-not-allowed"?"マイクの使用を許可してください（設定 → Safari → マイク）":"うまく聞き取れませんでした。もう一度どうぞ");b.disabled=false;b.textContent="🎤 話して答える";return}
        phase=1;draw()};
      if(q2("#c-play"))q2("#c-play").onclick=async()=>{stopSpeak();const tk=++speakToken;await speak(c.q,null,ctVoice(c));for(const a of c.ans){if(tk!==speakToken)return;await sleep(250);await speak(a.en,null,"madhur")}};
      body.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=+b.dataset.r;rateCard("c"+c.id,r);cnt[r]++;save();i++;phase=0;heard=null;draw()});
    }
    draw()})}

/* ============ 先生と話す（Claude のプロジェクト「ヒンディー語の先生」と音声で会話） ============
   先生のルールは docs/ヒンディー語の先生_プロジェクトの指示.md と同じ（TEACHER_RULES。直したら両方）。最初に1回だけプロジェクトの指示に貼ってもらう */
const TEACHER_RULES="あなたは、岩田章弘（いわた あきひろ / Aki）さん専属のヒンディー語の先生です。名前は「Meera 先生（मीरा जी）」。デリー出身で日本語も話せる、明るく、ていねいで、ほめ上手な先生として、音声でも文字でも会話の相手をします。\n\n## 生徒について\n- 岩田章弘さん（男性）。横浜出身。愛媛県大洲市で「あき鍼灸整骨院」を2018年10月に開業（スタッフ4名）。鍼灸師・柔道整復師。元アスレティックトレーナー。\n- 提携院への経営の手伝い、予約・顧客管理システムの提供、インドの企業向けのおもてなしコンサル、家族の酒店「小谷酒店」（1957年創業）の国際担当もしている。\n- インドに取引先・パートナーと仲間がいる。ヒンディー語はゼロから始め、1年後にヒンディー語で「取引先への会社・事業紹介」「インドの仲間の前でのスピーチ」「提案・商談の冒頭と締め」ができることを目指して、毎日3時間勉強している（細かい条件の話は英語でよい）。\n- 学習アプリ「ヒンディー語52週」を使っている。アプリの「先生と話す」から、その日のレッスン内容（週・レベル・文法・単語・プレゼンの課題など）が貼り付けられて会話が始まる。\n\n## 話し方のルール\n1. 生徒のレベル（貼り付けられた CEFR）に合わせた、短くはっきりしたヒンディー語で話す。A0〜A1 のうちは1文を短く、やさしい単語で、ゆっくり。相手には आप を使う。\n2. 文字で書くときは、ヒンディー語（デーヴァナーガリー）のあとに（ローマ字）を付け、A1 までは次の行に短い日本語訳も付ける。音声のときは、必要なときだけ日本語で短く助ける。\n3. 質問は1回に1つだけ。生徒がたくさん話せるように、先生の話は短くする（先生3割・生徒7割）。\n4. 会話の途中では、まちがいを止めて直さない。通じないときだけ、やさしく言い直して確かめる（「क्या आपका मतलब है …?」）。\n5. 生徒が日本語で話したり「〜はヒンディー語で何？」と聞いたら、ヒンディー語での言い方を1つ教えて、その文をもう一度言ってもらってから会話を続ける。\n6. 生徒が詰まったら、ヒントを出す（最初の2〜3語、または選択肢を2つ）。それでも出なければ日本語で少し説明してよい。\n7. よいところは具体的にほめる（「बहुत बढ़िया! ने を正しく使えましたね」など）。\n8. 性・数・आप の一致、後置詞、ने 構文など、日本人がつまずきやすいところは、会話のあとでまとめて教える。\n9. 経歴や数字は、生徒が話したことと上の「生徒について」だけを使い、作り話をしない。家族構成は生徒が話したことだけを使う。\n\n## レッスンの流れ（「先生と話す」から始めたとき）\n貼り付けられた内容に「レッスンの種類」が書いてあるので、それに合わせる。決まっていないときは次の流れで約15分。\n1. あいさつと雑談（2分）\n2. 今週の文法と単語を使う質問（5分）\n3. 今週の場面のロールプレイ（5分）\n4. 今週のプレゼンの一部を言ってもらい、聞き手として1〜2個質問する（3分）\n\n## キャッチボール練習（レッスンの種類が「キャッチボール」のとき）\n- 目的は、生徒が「答える → ひとこと足す → 聞き返す」を毎回できるようになること。\n- 雑談や仕事の、答えやすい質問を1つずつする。生徒の答えには短く反応し（「अच्छा!」「सच में?」「वाह!」）、生徒が聞き返したら先生も1〜2文で答えて、次の質問につなげる。\n- 生徒が聞き返すのを忘れたら、やさしく「मुझसे भी पूछिए!（私にも聞いてみて！）」と言う。答えが1語だけなら「थोड़ा और बताइए।」とうながす。\n- 1往復（生徒が答えて聞き返す）を1回と数え、何往復続いたかを覚えておく。\n- 終わったら、往復の回数と、生徒が使える聞き返しの言い方を5つ（ヒンディー語・ローマ字・日本語）教える。\n\n## プレゼンを聞くとき\n- インドの取引先や仲間の聞き手として、最後まで口をはさまずに聞く。\n- 「बस इतना ही」「終わり」と言われたら、聞き手として質問を1つずつ（レベルに合ったやさしいヒンディー語で）する。\n- 最後に、よかった点・直すと自然になる文（最大5つ）・発音や間の取り方のアドバイスを、やさしい日本語でまとめる。\n\n## 終わり方\n生徒が「終わり」「बस」「That's all」と言ったら、会話をやめて、やさしい日本語で次をまとめる。\n1. よかったところ（2つ）\n2. 生徒が言った文で、直すと自然になるもの（最大5つ。「言った文 → 自然な文（ローマ字）」と、短い理由）\n3. 今日の大事な表現（3つ。ヒンディー語・ローマ字・日本語）\n4. 次のレッスンまでの小さな宿題（1つ）\n\n最後に、2〜4 をアプリの「会話ノート」に貼り付けられるよう、そのままコピーしやすい形で書く。";
const TEACH_TYPES=[["today","今日のレッスン（おすすめ）","今週の文法・単語・場面とプレゼンを使って15分"],["catch","キャッチボール","答える → ひとこと足す → 聞き返す、で何往復続くか"],["grammar","今週の文法を教えてもらう","わからないところを日本語で質問しながら、やさしく練習"],["present","今週のプレゼンを聞いてもらう","原稿を発表して、質問とアドバイスをもらう"],["india","インドの取引先・仲間の役で会話","あいさつ・雑談・商談の冒頭と締めのロールプレイ"],["review","まちがえたところの復習","最近まちがえた文とひとことヒンディー語を使って"],["free","自由に雑談","今日あったこと・仕事・趣味など"]];
function teacherRow(){return `<button class="teachbtn" data-act="teacher"><span class="ic">${IMG_HAVE.has("aki-online")?pic("aki-online","",""):"👩‍🏫"}</span><span><b>先生と話す</b><small>Claude のヒンディー語の先生（Meera 先生）と、声でレッスン。今日の内容に合わせて話してくれます</small></span><span class="min">→</span></button>`}
function recentMistakes(){const st=S.studied||{};return Object.keys(st).sort().slice(-3).flatMap(d=>Object.entries(st[d]).filter(([k,r])=>r<2).map(([k])=>k)).map(cardFromKey).filter(Boolean).map(c=>c.item.en).filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,6)}
function teacherPrompt(type){const w=W(S.week),pw=PW(S.week),cefr=w?w.cefr:phaseOf(S.week).cefr;const t=TEACH_TYPES.find(x=>x[0]===type)||TEACH_TYPES[0];
  const hk=(S.hk&&S.hk.ids||[]).map(hkFind).filter(Boolean).map(h=>h.ja+" = "+h.ans[0].en+"（"+romOf(h.ans[0].en)+"）");const mis=recentMistakes();const own=pw?myScript(pw.week):"";
  return [`【ヒンディー語52週】Week ${S.week}・${S.day}日目　レベル CEFR ${cefr}`,
   `レッスンの種類：${t[1]}（${t[2]}）`,
   w?`今週のテーマ：${w.title}／文法：${w.grammar.title}／場面：${w.scene}`:"",
   w?`今週の単語：${w.vocab.slice(0,14).map(v=>v.en+"（"+romOf(v.en)+"・"+v.ja+"）").join(", ")}`:"",
   pw?`今週のプレゼン：${pw.title}（${pw.length}）— ${pw.taskEn}`:"",
   type==="present"&&own?`私の原稿（参考。読み上げないでください）：\n${own}`:"",
   (type==="review"||type==="today")&&mis.length?`最近まちがえた文：${mis.join(" / ")}`:"",
   (type==="review"||type==="today")&&hk.length?`今日のひとことヒンディー語：${hk.join(" / ")}`:"",
   "",
   "（「ヒンディー語の先生」プロジェクトの外で使うとき：あなたは私のヒンディー語の先生です。私のレベルに合わせた短くやさしいヒンディー語で、文字のときはローマ字と日本語訳も付けて、質問は1回に1つ。途中でまちがいは直さず、私が「終わり」と言ったら、よかった点・直した文（最大5つ）・大事な表現3つ・宿題1つを、やさしい日本語でまとめてください。）",
   type==="grammar"&&w?`今週の文法のポイント：${w.grammar.points.slice(0,3).join(" ")}\n例文：${w.grammar.examples.slice(0,3).map(e=>e.en+"（"+romOf(e.en)+"）").join(" / ")}`:"",
   type==="grammar"?"今週の文法を、中学生でもわかるやさしい日本語で、たとえ話を使って3〜5行で説明してください。日本語と同じところ・違うところも教えてください。むずかしい文法用語は使わないか、使うならすぐにやさしく言いかえてください。そのあと、日本語の短い文を1つずつ出して私にヒンディー語で言わせ、やさしく直してください（5問。答えにはローマ字を付けて）。私が日本語で質問したら、日本語でていねいに答えてください。":"",
   type==="catch"?`練習中の聞き返し表現：${HK().filter(h=>h.id>200).slice(0,8).map(h=>h.ans[0].en+"（"+romOf(h.ans[0].en)+"）").join(" / ")}`:"",
   type==="grammar"?"":type==="catch"?"キャッチボールの練習をしましょう。やさしい雑談や仕事の質問を、ヒンディー語で1つずつしてください。私の目標は「答える → ひとこと足す → 聞き返す」です。私の答えに短く反応し、私が聞き返したら1〜2文で答えて、次の質問をしてください。私が聞き返すのを忘れたら「मुझसे भी पूछिए!」と言ってください。何往復続いたか数えて、「終わり」と言ったら回数と聞き返しの言い方5つ（ヒンディー語・ローマ字・日本語）をやさしい日本語で教えてください。":type==="present"?"まず私のプレゼンを最後まで聞いてください。「बस इतना ही」か「終わり」と言ったら、インドの取引先・仲間として、やさしいヒンディー語で質問を1つずつしてから、フィードバックをください。":type==="india"?"インドの取引先（または仲間）の役になって、今週の場面に合った会話をヒンディー語で始めてください。":"短くあたたかいヒンディー語のあいさつ（ローマ字と日本語訳つき）で、レッスンを始めてください。"].filter(x=>x!=="").join("\n")}
function openTeacher(){let type="today";
  openLesson("先生と話す","",()=>"",body=>{

        <details><summary class="small" style="cursor:pointer">コピーする内容を見る</summary><textarea id="t-src" readonly style="min-height:160px;font-size:13px;margin-top:6px">${esc(teacherPrompt(type))}</textarea></details></div>

/* ============ 1日3時間コース と プレゼン教材（data/present1〜4.js） ============
   いつものメニュー（約1時間）＋ プレゼン60分 ＋ 耳30分 ＋ 復習とふりかえり30分 */
const PDAY={1:["教科書を読んで、手本を聞く",[["教科書を読む",20],["表現10を声に出す",20],["手本を聞く",20]]],
 2:["表現と手本の練習",[["表現カード",15],["手本のシャドーイング",25],["手本を見ないで言ってみる",20]]],
 3:["自分の原稿を書く",[["自分の原稿を書く",40],["AI に直してもらう",20]]],
 4:["音読と暗唱",[["原稿を5回音読する",20],["見ないで言う（暗唱）",25],["スライド1枚の要点を書く",15]]],
 5:["時間を計って通し練習",[["時間を計って通し練習（3回）",30],["録音を聞いてチェック",20],["直すところを原稿に入れる",10]]],
 6:["本番と質疑応答",[["AI の前で本番",30],["質疑応答の練習",20],["言われたことを原稿に入れる",10]]],
 7:["ふりかえり",[["表現テスト",15],["手本と自分の原稿の暗唱",25],["チェックリストで自己評価",20]]]};
function dayIdx(w,d){return (w-1)*7+d}
function ensureCourse(){if(S.settings.course===undefined){S.settings.course="3h";S.settings.c3from=dayIdx(S.week,S.day);save()}}
function course3h(w,d){return S.settings.course==="3h"&&S.settings.c3from!=null&&dayIdx(w,d)>=S.settings.c3from}
// 合計がちょうど3時間になるよう、いつものメニューが短い日は「耳」を長くする
function dayBase(w,d){const lt=letterTask(W(w),d);return lt?[lt,...DAYS[d].tasks]:DAYS[d].tasks}
function planTasks(w,d){const b=dayBase(w,d);if(!course3h(w,d))return b;const base=b.reduce((a,t)=>a+t[1],0);return b.concat([["present",60,d],["listen",Math.max(30,90-base)],["wrap",30]])}
function PW(n){return (window.PRESENT||[]).find(p=>p.week===n)||null}
function presentCard(week,i){const pw=PW(week);const p=pw&&pw.phrases[i];if(!p)return null;return{key:`p${week}-${i}`,type:"s",item:{ja:p.ja,en:p.en,note:p.note},week,noteLabel:"プレゼン表現"}}
function presentLines(pw){return pw.model.lines.map(l=>({s:"A",name:"Akihiro",en:l.en,ja:l.ja}))}
function myScript(n){return ((S.pscript||{})[n]||"")}
function scriptLines(txt){return String(txt).replace(/\s+/g," ").trim().split(/(?<=[.!?।])\s+/).filter(Boolean)}
function pchecks(pw){return pw.check.map((c,i)=>`<label class="row small" style="gap:8px"><input type="checkbox" data-pchk="${i}" ${((S.pcheck||{})[pw.week]||[]).includes(i)?"checked":""} style="width:20px;height:20px;accent-color:var(--green)"> ${esc(c)}</label>`).join("")}

 <div class="card stack"><h3>📖 教科書</h3>${pw.lesson.map(p=>`<p>${esc(p)}</p>`).join("")}</div>

 <div class="card"><h3>💬 使える表現10</h3>${pw.phrases.map(p=>`<div class="exline">${spkBtn(p.en,"madhur")}<div class="t"><span class="en">${tg(p.en)}</span><span class="small">${esc(p.ja)}</span>${p.note?`<span class="exnote">💡 ${esc(p.note)}</span>`:""}</div></div>`).join("")}</div>
 <details class="card" ${open?"open":""}><summary><b>🎤 手本「${esc(pw.model.title)}」（${esc(pw.model.time)}）</b></summary>${pw.model.note?`<p class="small muted">${esc(pw.model.note)}</p>`:""}${pw.model.lines.map(l=>`<div class="exline">${spkBtn(l.en,"madhur")}<div class="t"><span class="en">${tg(l.en)}</span><span class="small muted">${esc(l.ja)}</span></div></div>`).join("")}</details>
 <div class="card stack"><h3>✍️ あなたの課題</h3><p>${esc(pw.task)}</p><p class="small muted">🖼 スライドのヒント：${esc(pw.slide)}</p></div>
 ${(pw.qa||[]).length?`<details class="card"><summary><b>❓ 想定される質問（${pw.qa.length}）</b></summary>${pw.qa.map(q=>`<div class="exline">${spkBtn(q.q,"swara")}<div class="t"><span class="en"><b>Q.</b> ${tg(q.q)}</span><span class="en"><b>A.</b> ${tg(q.a)}</span><span class="small muted">${esc(q.ja)}</span></div></div>`).join("")}</details>`:""}
 <div class="card stack"><h3>✅ チェックリスト</h3>${pw.check.map(c=>`<div class="small">□ ${esc(c)}</div>`).join("")}</div>`}

  openLesson("プレゼン練習",`W${pw.week}`,"",body=>{

     <div class="steps">${[1,2,3,4,5,6,7].map(k=>`<button data-pst="${k}" class="${k===step?"on":""}">${k}日目</button>`).join("")}</div>

    if(step===2)h+=`<div class="card stack"><h3>① 表現カード</h3><p class="small muted">日本語を見て、ヒンディー語の表現を言えるか試します。</p><div><button class="btn accent" id="p-cards">表現カードを始める</button></div></div>
      <div class="card stack"><h3>② 手本のシャドーイング</h3><p class="small muted">「③重ねて読む」→「④シャドーイング」の順で。止めても続きから再生できます。</p><div><button class="btn accent" id="p-shadow">手本をシャドーイング</button></div></div>
      <div class="card stack"><h3>③ 見ないで言ってみる</h3><p class="small muted">手本を1行ずつ見て → 目をはなして言う。全部でなくて大丈夫。最初の3行だけでも言えたら合格です。</p></div>
      <details class="card"><summary><b>手本の原稿を見る</b></summary>${pw.model.lines.map(l=>`<div class="exline">${spkBtn(l.en,"madhur")}<div class="t"><span class="en">${tg(l.en)}</span><span class="small muted">${esc(l.ja)}</span></div></div>`).join("")}</details>`;
    if(step===3)h+=`<div class="card stack"><h3>課題</h3><p>${esc(pw.task)}</p><div class="small"><b>型：</b>${pw.structure.map(s=>esc(s.ja)).join(" → ")}</div><p class="small muted">手本と使える表現をまねして大丈夫です。ローマ字で書いても、書けないところは日本語のままでも OK。AI がヒンディー語（文字とローマ字）にしてくれます。</p></div>
      <div class="card stack"><label for="p-script"><b>自分の原稿（ヒンディー語。ローマ字でもOK）</b></label><textarea id="p-script" style="min-height:220px" placeholder="सबको नमस्ते! मेरा नाम आकिहिरो इवाता है। …（sabko namaste! merā nām Ākihiro Ivātā hai. …）">${esc(own)}</textarea><div class="small muted mono" id="p-wc"></div></div>
      <div class="row"><button class="btn accent" id="p-ai">AI に直してもらう</button></div><div id="p-aiout"></div>

       <div id="p-lines">${lines.map(l=>`<div class="exline">${spkBtn(l,"madhur")}<div class="t"><span class="en">${tg(l)}</span></div></div>`).join("")}</div>
       ${own?`<div><button class="btn sm" id="p-myshadow">自分の原稿をシャドーイング画面で</button></div>`:""}</div>`;
      if(step===4)h+=`<div class="card stack"><h3>スライド1枚の要点</h3><p class="small muted">${esc(pw.slide)}</p><textarea id="p-slide" style="min-height:90px" placeholder="スライドに書く言葉（3〜5語×3行くらい）">${esc(((S.pslide||{})[pw.week])||"")}</textarea></div>`;
      if(step===5)h+=`<div class="card stack" style="align-items:center;text-align:center"><div class="eyebrow">目標 ${esc(pw.length)}</div><div class="mono" id="p-clock" style="font-size:48px;font-weight:600">0:00</div>
        <div class="row" style="justify-content:center"><button class="btn primary" id="p-go">▶ 計る</button><button class="btn" id="p-reset">リセット</button></div>
        <p class="small muted">iPhone の「ボイスメモ」で録音しながら話し、あとで聞き直しましょう。</p><div class="small" id="p-laps"></div></div>
        <div class="card stack"><h3>聞き直してチェック</h3>${pchecks(pw)}</div>`}
    if(step===6)h+=`<div class="card stack"><h3>① AI の前で本番（Claude アプリの音声モード）</h3><p class="small muted">Claude がインドの取引先・仲間の役で聞き、終わったらやさしいヒンディー語で質問をして、最後に日本語でフィードバックをくれます。</p><div id="p-bridge"></div></div>
      ${(pw.qa||[]).length?`<div class="card"><div class="spread"><h3>② 質疑応答の練習</h3><button class="btn sm ghost" id="p-qhide">答えを隠す／見せる</button></div>${pw.qa.map(q=>`<div class="exline">${spkBtn(q.q,"swara")}<div class="t"><span class="en"><b>Q.</b> ${tg(q.q)}</span><span class="en pans"><b>A.</b> ${tg(q.a)}</span><span class="small muted">${esc(q.ja)}</span></div></div>`).join("")}<p class="small muted">質問を聞いて、答えを隠したまま自分のことばで答えてみましょう。</p></div>`:""}`;
    if(step===7)h+=`<div class="card stack"><h3>① 表現テスト</h3><p class="small muted">今週の表現10を、日本語からヒンディー語で言えるか確かめます。</p><div><button class="btn accent" id="p-cards">表現テストを始める</button></div></div>
      <div class="card stack"><h3>② 暗唱</h3><p class="small muted">手本と自分の原稿を、見ないで通して言ってみます。</p><div class="row"><button class="btn" id="p-shadow">手本をもう一度</button>${own?`<button class="btn" id="p-myshadow">自分の原稿</button>`:""}</div></div>
      <div class="card stack"><h3>③ 自己評価</h3>${pchecks(pw)}</div>`;
    h+=finishBtn(step+"日目のプレゼン練習・完了")+"</div>";
    body.innerHTML=h;bindFinish(body,done);
    body.querySelectorAll("[data-pst]").forEach(b=>b.onclick=()=>{stopSpeak();step=+b.dataset.pst;closeLesson();setTimeout(()=>lessonPresent(pw,step,done),40)});

    if(q("#p-ai"))q("#p-ai").onclick=()=>{const mine=(q("#p-script").value||"").trim();if(!mine){toast("先に原稿を書いてください（日本語まじりでもOK）");return}
      askAI(`あなたはヒンディー語のビジネスプレゼンを教える講師です。学習者は日本人の鍼灸師・柔道整復師の岩田章弘さん（愛媛県大洲市で院を経営。インドに取引先と仲間がいる）で、ヒンディー語のレベルは CEFR ${pw.level} です。\n今週の課題：${pw.task}\n今週の型：${pw.structure.map(s=>s.ja).join(" → ")}\n目標の長さ：${pw.length}\n\n岩田さんの原稿（デーヴァナーガリー・ローマ字・日本語がまざっていてよい。日本語の部分はヒンディー語にしてください）：\n${mine}\n\n次の順で、やさしい日本語で答えてください。\n1) よいところ（2行）\n2) 直した原稿の全文（話し言葉の自然で正しいヒンディー語。${pw.level} のレベルで、1文は短く。型の順にする。1文ごとにデーヴァナーガリーの次の行にローマ字）\n3) 直した理由（性・数・आप の一致、後置詞など、大事なものを最大5つ、1行ずつ）\n4) 本番でゆっくり言うとよい文を1つ`,q("#p-aiout"),{title:"Claude に原稿を直してもらう"})};
    if(q("#p-hide"))q("#p-hide").onclick=()=>q("#p-lines").querySelectorAll(".en").forEach(e=>e.classList.toggle("blur"));
    if(q("#p-qhide"))q("#p-qhide").onclick=()=>body.querySelectorAll(".pans").forEach(e=>e.classList.toggle("blur"));
    const sl=q("#p-slide");if(sl)sl.oninput=()=>{if(!S.pslide)S.pslide={};S.pslide[pw.week]=sl.value;clearTimeout(sl._t);sl._t=setTimeout(save,600)};
    body.querySelectorAll("[data-pchk]").forEach(c=>c.onchange=()=>{if(!S.pcheck)S.pcheck={};const a=new Set(S.pcheck[pw.week]||[]);c.checked?a.add(+c.dataset.pchk):a.delete(+c.dataset.pchk);S.pcheck[pw.week]=[...a];save()});
    if(q("#p-go")){let t0=null,acc=0,tm=null;const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");const laps=[];
      const tick=()=>{q("#p-clock").textContent=fmt((acc+(t0?Date.now()-t0:0))/1000)};
      q("#p-go").onclick=()=>{if(t0){acc+=Date.now()-t0;t0=null;clearInterval(tm);q("#p-go").textContent="▶ 続きから";laps.push(fmt(acc/1000));q("#p-laps").textContent="記録："+laps.join("・")}else{t0=Date.now();tm=setInterval(tick,250);q("#p-go").textContent="❚❚ 止める"}};
      q("#p-reset").onclick=()=>{clearInterval(tm);t0=null;acc=0;q("#p-go").textContent="▶ 計る";tick()};onClose=()=>clearInterval(tm)}
    const br=q("#p-bridge");if(br){const own2=myScript(pw.week);claudeBridge(br,`ヒンディー語のビジネスプレゼンを、声で練習させてください。あなたは、私のプレゼンを聞くインドの人たち（たとえばホテルの支配人とクリニックの経営者、または仲間の集まり）です。私は岩田章弘、愛媛県大洲市で鍼灸整骨院を経営している日本人で、ヒンディー語は CEFR ${pw.level} レベルの学習中です。
テーマ：${pw.title}（${pw.taskEn}）
目標の長さ：${pw.length}
${own2?"私の原稿（参考です。読み上げないでください）：\n"+own2+"\n":""}

2) 私が「बस इतना ही」か「終わり」と言ったら、聞き手として、私のレベルに合ったやさしいヒンディー語で質問を ${Math.max(2,(pw.qa||[]).length)} つ、1つずつしてください。毎回、私の答えを待ってください。

/* ============ 1日のふりかえりテスト（その日に練習したカードだけで5分） ============ */
function studiedToday(){return (S.studied||{})[today()]||{}}
function dayCheckRow(allDone){const keys=Object.keys(studiedToday()).filter(k=>cardFromKey(k));const res=(S.dayTest||{})[today()];
  if(!keys.length&&!res)return"";
  return `<button class="checkbtn ${allDone&&!res?"hot":""}" data-act="daycheck"><span class="ic">🌙</span><span><b>1日のふりかえりテスト${res?`　<em class="tstate ok">${res.p}点</em>`:""}</b><small>${res?"今日のテストは終わっています。もう一度やってもOK":`今日練習した ${keys.length}枚から出題・約5分。寝る前の1回で、記憶に残りやすくなります`}</small></span><span class="min">→</span></button>`}
function dcTiles(en){const sp=x=>String(x||"").replace(/([।.?!,])/g," $1").split(/\s+/).filter(Boolean);const h=sp(en),r=sp(romOf(en));if(h.length<3||h.length>12)return null;return shuffle(h.map((t,k)=>({t,r:r.length===h.length?r[k]:""})))}
const dcTileH=x=>{const m=S.settings.script||"full";return m==="rom"&&x.r?`<span class="hi-rom">${esc(x.r)}</span>`:esc(x.t)+((m==="full"||m==="kana")&&x.r?`<small class="kana">${kanaHTML(x.r)}</small>`:m==="both"&&x.r?`<small>${esc(x.r)}</small>`:"")};
function lessonDayCheck(){
  const st=studiedToday();
  // 出す順：今日「わからない・あいまい」だったもの → 残りをばらばらに。足りなければ今週の単語で埋める
  let keys=[...shuffle(Object.keys(st).filter(k=>st[k]<2)),...shuffle(Object.keys(st).filter(k=>st[k]>=2))].filter(k=>cardFromKey(k)).slice(0,8);
  const w=W(S.week);
  if(keys.length<5&&w)keys=keys.concat(shuffle(w.vocab.map((_,i)=>"v"+S.week+"-"+i).filter(k=>!keys.includes(k)))).slice(0,6);
  const vpool=w?w.vocab:[],hpool=HK();
  const Q=keys.map(k=>{const c=cardFromKey(k);if(!c)return null;const it=c.item;
    if(c.type==="v"){const pool=(W(c.week)||w||{vocab:vpool}).vocab;const wrong=shuffle(pool.filter(x=>x.ja!==it.ja)).slice(0,3).map(x=>x.ja);
      return{key:k,kind:"v",q:it.en,a:it.ja,opts:shuffle([it.ja,...wrong]),say:it.en,label:"単語"}}
    if(/^h\d+$/.test(k)){const h=hkFind(+k.slice(1));const same=hpool.filter(x=>hkSetOf(x)===hkSetOf(h)&&x.id!==h.id);const wrong=shuffle(same).slice(0,3).map(x=>x.ans[0].en);
      return{key:k,kind:"c",q:"「"+h.ja+"」",sub:h.q?"相手："+h.q.en+"（"+h.q.ja+"）":"場面："+h.scene,a:h.ans[0].en,opts:shuffle([h.ans[0].en,...wrong]),say:h.ans[0].en,label:"ひとことヒンディー語"}}
    const tiles=dcTiles(it.en);if(!tiles)return null;
    return{key:k,kind:"s",q:it.q||it.ja,a:it.en,tiles,say:it.en,label:c.noteLabel||"文"}}).filter(Boolean);
  let i=0,score=0,picked=[],answered=false;const miss=[];
  const norm=s=>normHi(s).replace(/[^\p{L}\p{M}\p{N}' ]/gu,"").replace(/\s+/g," ").trim();
  function judge(q,ok){answered=true;if(ok)score++;else{miss.push(q);rateCard(q.key,0)}save()}
  function draw(body){
    if(!Q.length){body.innerHTML=`<div class="stack"><p>今日はまだテストに出せるカードがありません。</p><p class="small muted">単語カード・瞬間作文・ひとことヒンディー語などで練習すると、その分から出題されます。</p>${finishBtn("閉じる")}</div>`;bindFinish(body,closeLesson);return}
    if(i>=Q.length){const pts=Math.round(score/Q.length*100);if(!S.dayTest)S.dayTest={};const prev=S.dayTest[today()];if(!prev||pts>prev.p)S.dayTest[today()]={p:pts,n:Q.length};logMinutes(5,"daycheck");save();
      const L=S.log[today()]||{m:0};const kinds={};Object.keys(st).forEach(k=>{const c=cardFromKey(k);if(c){const nm=/^h/.test(k)?"ひとこと":c.type==="v"?"単語":"文";kinds[nm]=(kinds[nm]||0)+1}});
      body.innerHTML=`<div class="stack">${pic(pts>=100&&IMG_HAVE.has("aki-medal")?"aki-medal":pts>=70?(IMG_HAVE.has("aki-night")?"aki-night":"aki-cheer"):"aki-think","dc-img","")}
        <div class="eyebrow">今日のふりかえり</div><h2 class="mono" style="font-size:44px">${pts}<span style="font-size:18px">点</span></h2>
        <p>${pts>=100?"全問正解！今日の分はしっかり頭に入っています。":pts>=70?"よくできました。まちがえた分は明日の復習に入れました。":"まちがえた分を明日の復習に入れました。寝る前にもう一度だけ下の文を声に出して読むと効果的です。"}</p>
        <div class="card stack"><b>今日やったこと</b><div class="small">勉強した時間 <b class="mono">${L.m||0}分</b>${L.s?`・ヒンディー語で話した <b class="mono">${L.s}分</b>`:""}</div>
         <div class="small">練習したカード：${Object.entries(kinds).map(([k,n])=>`${k} <b class="mono">${n}</b>`).join("・")||"—"}</div></div>
        ${miss.length?`<div class="card stack"><b>まちがえたもの（明日の復習に入れました）</b>${miss.map(q=>`<div class="exline">${spkBtn(q.say)}<div class="t"><span class="en">${tg(q.kind==="v"?q.q:q.a)}</span><span class="small muted">${esc(q.kind==="v"?q.a:q.q)}</span></div></div>`).join("")}</div>`:""}
        ${finishBtn()}</div>`;bindFinish(body,closeLesson);return}
    const q=Q[i];
    let h=`<div class="stack"><div class="spread"><span class="small muted mono">${i+1} / ${Q.length}</span><span class="chip">${esc(q.label)}</span></div><div class="progress"><span style="width:${i/Q.length*100}%"></span></div>`;
    if(q.kind==="v"||q.kind==="c"){
      h+=q.kind==="v"?`<div class="flash" style="min-height:130px"><div class="word">${tg(q.q)}</div>${spkBtn(q.q)}</div><p class="small muted">意味はどれ？</p>`
        :`<div class="hk-cap big"><b>${esc(q.q)}</b><span>ってヒンディー語で？</span></div><p class="small muted" style="text-align:center">${esc(q.sub)}</p>`;
      h+=`<div class="opts ${q.kind==="c"?"en":""}">${q.opts.map((o,k)=>`<button class="opt ${answered?(o===q.a?"ok":picked[0]===k?"ng":""):""}" data-o="${k}">${q.kind==="c"?tg(o):esc(o)}</button>`).join("")}</div>`}
    else{h+=`<div class="card"><div class="eyebrow">並べ替え</div><p style="font-size:17px;font-weight:700">${esc(q.q)}</p></div>
      <div class="answer en">${picked.map((k,j)=>`<button class="tile" data-un="${j}">${dcTileH(q.tiles[k])}</button>`).join("")}</div>
      <div class="tiles en">${q.tiles.map((t,k)=>`<button class="tile ${picked.includes(k)?"used":""}" data-t="${k}" ${picked.includes(k)?"disabled":""}>${dcTileH(t)}</button>`).join("")}</div>
      ${answered?`<div class="ai"><b>${norm(picked.map(k=>q.tiles[k].t).join(" "))===norm(q.a)?"正解":"正解は"}</b>　<span class="en">${tg(q.a)}</span></div>`:`<div><button class="btn primary" id="judge" ${picked.length<q.tiles.length?"disabled":""}>答え合わせ</button></div>`}`}
    if(answered)h+=`<div><button class="btn primary" id="next">次へ →</button></div>`;
    body.innerHTML=h+"</div>";
    body.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(answered)return;picked=[+b.dataset.o];judge(q,q.opts[picked[0]]===q.a);speak(q.say,undefined,q.kind==="c"?hkVoice(hkFind(+q.key.slice(1)),0):undefined);draw(body)});
    body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(answered)return;picked.push(+b.dataset.t);draw(body)});
    body.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{if(answered)return;picked.splice(+b.dataset.un,1);draw(body)});
    const jg=body.querySelector("#judge");if(jg)jg.onclick=()=>{judge(q,norm(picked.map(k=>q.tiles[k].t).join(" "))===norm(q.a));speak(q.a);draw(body)};
    const nx=body.querySelector("#next");if(nx)nx.onclick=()=>{i++;picked=[];answered=false;draw(body)};
  }
  openLesson("1日のふりかえり","約5分","",draw)}

/* ============ ひとことヒンディー語（「これヒンディー語で？」と、とっさの返事60） ============
   英語版の「ひとこと英語」と同じ流れ：日本語のひとこと → 考える時間 → 言い方を2〜3通り、ニュアンス付きで。
   教材は data/hitokoto.js（id 1〜60＝これヒンディー語で？、101〜160＝とっさの返事60）と data/catch.js（201〜230＝聞き返し30） */
const HK=()=>window.HITOKOTO||[];
const HK_SETS=[{k:"kiki",name:"聞き返し30",desc:"会話を続けるための、聞き返し・相づち・話を広げる表現"},{k:"kore",name:"これヒンディー語で？",desc:"日本語のひとことを、場面に合ったヒンディー語で。言い方は2〜3通り"},{k:"tossa",name:"とっさの返事60",desc:"相手の言葉に、とっさに返すひとこと"}];
const hkSetOf=h=>h.id>200?"kiki":h.id>100?"tossa":"kore";
const hkFind=id=>HK().find(h=>h.id===+id);
const hkLearned=h=>{const s=S.srs["h"+h.id];return s&&s.b>=2};
function hkVoice(h,i){return hkSetOf(h)==="kore"?"swara":"madhur"}
function hkCard(id){const h=hkFind(id);if(!h)return null;
  return{key:"h"+id,type:"s",item:{q:"「"+h.ja+"」",hint:h.q?"相手："+h.q.en+"（"+romOf(h.q.en)+"・"+h.q.ja+"）":"場面："+h.scene,en:h.ans[0].en,ja:h.ans.slice(1).map(a=>a.en+"（"+romOf(a.en)+"）").join(" ／ "),note:h.tip||h.ans[0].nu},week:S.week,noteLabel:"ひとことヒンディー語"}}
function hkMark(en,hl){const e=esc(en);if(!hl)return e;const h=esc(hl);const i=e.toLowerCase().indexOf(h.toLowerCase());return i<0?e:e.slice(0,i)+"<mark>"+e.slice(i,i+h.length)+"</mark>"+e.slice(i+h.length)}
// 今日の3つ（これヒンディー語で？・とっさの返事・聞き返し を1つずつ。まだ練習していないものから順に）
function hkToday(){const t=today();
  if(!S.hk||S.hk.date!==t){const fresh=HK().filter(h=>!S.srs["h"+h.id]);
    const ids=[...fresh.filter(h=>h.id<100).slice(0,1),...fresh.filter(h=>h.id>100&&h.id<200).slice(0,1),...fresh.filter(h=>h.id>200).slice(0,1)].map(h=>h.id);
    S.hk={date:t,ids,done:[]};save()}
  return S.hk}
function hkTodayCard(){if(!HK().length)return"";const t=hkToday();const left=t.ids.filter(id=>!t.done.includes(id));const h=hkFind(left[0]||t.ids[0]);
  const n=HK().filter(hkLearned).length;
  return `<button class="hkcard" data-act="hk"><span class="hk-top"><span class="hk-eb">${left.length?"今日のひとことヒンディー語":"今日のひとこと 完了 ✓"}</span><span class="small mono">覚えた ${n}/${HK().length}</span></span>
   ${h?`<span class="hk-cap"><b>「${esc(h.ja)}」</b><span>ってヒンディー語で？</span></span>`:""}
   <small>${left.length?`あと${left.length}つ。考えて → 口に出して → 答え合わせ`:"もっとやる・一覧を見る →"}</small></button>`}
function openHitokoto(mode){
  let view=mode==="kiki"?"list":mode||"today",q=[],i=0,phase=0,timer=null,cnt=[0,0,0],listSet=mode==="kiki"?"kiki":"kore";
  const clear=()=>{if(timer){clearInterval(timer);timer=null}};
  function startQuiz(ids){q=ids.map(hkFind).filter(Boolean);i=0;phase=0;cnt=[0,0,0];view="quiz"}
  function draw(body){clear();
    if(view==="today"){const t=hkToday();const left=t.ids.filter(id=>!t.done.includes(id));
      if(left.length){startQuiz(left)}else view="list"}
    if(view==="list")return drawList(body);
    if(i>=q.length){logMinutes(Math.max(2,q.length),"hitokoto");save();
      body.innerHTML=`<div class="stack" style="text-align:center">${pic(IMG_HAVE.has("aki-check")?"aki-check":"aki-cheer","empty-img","")}<h2>おつかれさまでした</h2><p>${q.length}つのうち、言えた ${cnt[2]}・近かった ${cnt[1]}・出てこなかった ${cnt[0]}</p><p class="small muted">練習したひとことは、時期をおいて「復習」のカードに出てきます。</p>
       <div class="row" style="justify-content:center"><button class="btn primary" id="hk-more">もう3つやる</button><button class="btn" id="hk-list">一覧を見る</button></div></div>`;
      body.querySelector("#hk-more").onclick=()=>{const fresh=HK().filter(h=>!S.srs["h"+h.id]);startQuiz(fresh.slice(0,3).map(h=>h.id));draw(body)};
      body.querySelector("#hk-list").onclick=()=>{view="list";draw(body)};return}
    const h=q[i],set=hkSetOf(h);
    const partner=h.q?`<div class="hk-partner">${partnerPic("Raj","avatar")}<div class="t"><span class="en">${tg(h.q.en)}</span><small class="muted">${esc(h.q.ja)}</small></div>${spkBtn(h.q.en,"madhur")}</div>`:"";
    const cap=phase===0?`<div class="hk-cap big"><b>「${esc(h.ja)}」</b><span>ってヒンディー語で？</span></div>`
      :phase===1?`<div class="hk-cap big think"><b>考えてみて！</b><span>口に出して言ってみよう</span><i class="hk-bar"><em id="hk-fill"></em></i></div>`
      :`<div class="hk-cap big"><b>「${esc(h.ja)}」</b><span>はヒンディー語で…</span></div>`;
    body.innerHTML=`<div class="stack"><div class="spread"><span class="small muted mono">${i+1} / ${q.length}</span><span class="chip">${esc(HK_SETS.find(s=>s.k===set).name)}・${esc(h.tag)}</span></div>
     <div class="progress"><span style="width:${i/q.length*100}%"></span></div>
     ${partner}
     ${cap}
     ${h.scene&&!h.q?`<p class="small muted" style="text-align:center">場面：${esc(h.scene)}</p>`:""}
     ${phase<2?`<button class="btn primary" id="hk-next" style="justify-content:center;width:100%">${phase===0?"考える（5秒）":"答えを見る"}</button>`
      :`<div class="card stack">${h.ans.map((a,k)=>`<div class="hk-ans">${spkBtn(a.en,hkVoice(h,k))}<div class="t">${h.ans.length>1?`<span class="hk-n">${k+1}つ目</span>`:""}<span class="en">${tgMark(a.en,a.hl)}</span><small class="muted">${esc(a.nu)}</small></div></div>`).join("")}
        ${h.phrase?`<div class="small">覚えるフレーズ：<b class="en">${tg(h.phrase)}</b>＝${esc(h.ja)}</div>`:""}</div>
       ${h.tip?`<div class="tip">💡 ${esc(h.tip)}</div>`:""}
       <div class="rate"><button class="r0" data-r="0">出てこなかった<small>もう一度</small></button><button class="r1" data-r="1">近かった<small>明日</small></button><button class="r2" data-r="2">言えた<small>先へ延ばす</small></button></div>`}
     <div class="row" style="justify-content:center"><button class="btn sm ghost" id="hk-tolist">一覧を見る</button></div></div>`;
    if(phase===0&&h.q)speak(h.q.en,undefined,"madhur");
    if(phase===2)speak(h.ans[0].en,undefined,hkVoice(h,0));
    const nx=body.querySelector("#hk-next");if(nx)nx.onclick=()=>{phase++;draw(body)};
    if(phase===1){const t0=Date.now(),fill=body.querySelector("#hk-fill");timer=setInterval(()=>{const r=(Date.now()-t0)/5000;if(fill)fill.style.width=Math.min(100,r*100)+"%";if(r>=1){clear();if(view==="quiz"&&q[i]===h&&phase===1){phase=2;draw(body)}}},100)}
    body.querySelector("#hk-tolist").onclick=()=>{view="list";draw(body)};
    body.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=+b.dataset.r;rateCard("h"+h.id,r);cnt[r]++;
      const t=hkToday();if(t.ids.includes(h.id)&&!t.done.includes(h.id))t.done.push(h.id);
      if(r===0&&q.indexOf(h)===i&&!q.slice(i+1).includes(h))q.push(h);
      save();i++;phase=0;draw(body)});
  }
  function drawList(body){const set=HK_SETS.find(s=>s.k===listSet);const items=HK().filter(h=>hkSetOf(h)===listSet);
    const tags=[...new Set(items.map(h=>h.tag))];const n=items.filter(hkLearned).length;
    body.innerHTML=`<div class="stack"><div class="mascot-side">${pic("aki-point","","")}<div><div class="eyebrow">Hitokoto Hindi</div><h2>ひとことヒンディー語</h2><p class="small muted" style="margin-top:4px">日本語でよく言うひとことを、場面に合った自然なヒンディー語で。「これヒンディー語で？ → 考えてみて → 言い方いくつか」の流れで、英語版の「ひとこと英語」と同じです。</p></div></div>
     <div class="tabs">${HK_SETS.map(s=>`<button data-hset="${s.k}" class="${s.k===listSet?"on":""}">${s.name}</button>`).join("")}</div>
     <p class="small muted">${esc(set.desc)}　<b class="mono">覚えた ${n}/${items.length}</b></p>
     <div class="row"><button class="btn accent" id="hk-new">まだの5つを練習</button><button class="btn" id="hk-rev">覚えたか確かめる</button></div>
     ${tags.map(tg=>`<h3>${esc(tg)}</h3><div class="card hklist">${items.filter(h=>h.tag===tg).map(h=>`<details class="hkrow"><summary><span class="hk-ok">${hkLearned(h)?"✓":S.srs["h"+h.id]?"…":""}</span><b>${esc(h.ja)}</b><span class="en small muted">${esc(h.ans[0].en)}　${esc(romOf(h.ans[0].en))}</span></summary>
        <div class="stack" style="padding:8px 0 4px">${h.q?`<div class="small muted">相手：<span class="en">${tg(h.q.en)}</span>（${esc(h.q.ja)}）</div>`:`<div class="small muted">場面：${esc(h.scene)}</div>`}

  out.srs=Object.assign({},L.srs);Object.entries(R.srs||{}).forEach(([k,c])=>{const a=out.srs[k];if(!a||c.d>a.d||(c.d===a.d&&c.b>a.b))out.srs[k]=c});
  out.log=Object.assign({},L.log);Object.entries(R.log||{}).forEach(([day,l])=>{const a=out.log[day];out.log[day]=!a?l:{m:Math.max(a.m||0,l.m||0),s:Math.max(a.s||0,l.s||0),t:(a.t||[]).length>=(l.t||[]).length?a.t:l.t}});
  out.dayDone=Object.assign({},L.dayDone||{});Object.entries(R.dayDone||{}).forEach(([k,a])=>{out.dayDone[k]=[...new Set([...(out.dayDone[k]||[]),...a])]});
  out.tests=Object.assign({},L.tests);Object.entries(R.tests||{}).forEach(([w,p])=>{out.tests[w]=Math.max(out.tests[w]||0,p)});
  const uniq=(arr,key)=>{const m=new Map();arr.forEach(x=>{if(x)m.set(key(x),x)});return [...m.values()]};
  out.scores=uniq([...(older.scores||[]),...(newer.scores||[])],x=>x.date+"|"+x.test+"|"+x.result);
  out.diary=uniq([...(older.diary||[]),...(newer.diary||[])],x=>x.date).sort((a,b)=>a.date<b.date?-1:1);
  const pm=new Map();[...(older.people||[]),...(newer.people||[])].forEach(p=>{if(!p||!p.name)return;const o=pm.get(p.name)||{};pm.set(p.name,{name:p.name,org:p.org||o.org||"",memo:p.memo||o.memo||""})});out.people=[...pm.values()];
  out.studied=Object.assign({},L.studied||{});Object.entries(R.studied||{}).forEach(([d,m])=>{const a=Object.assign({},out.studied[d]||{});Object.entries(m).forEach(([k,r])=>{a[k]=a[k]==null?r:Math.min(a[k],r)});out.studied[d]=a});
  out.dayTest=Object.assign({},L.dayTest||{});Object.entries(R.dayTest||{}).forEach(([d,x])=>{const a=out.dayTest[d];if(!a||(x.p||0)>(a.p||0))out.dayTest[d]=x});
  out.deletedNotes=[...new Set([...(L.deletedNotes||[]),...(R.deletedNotes||[])])];
  if(L.doneToday&&R.doneToday&&L.doneToday.date===R.doneToday.date&&L.week===R.week&&L.day===R.day)out.doneToday={date:L.doneToday.date,tasks:[...new Set([...(L.doneToday.tasks||[]),...(R.doneToday.tasks||[])])]};
  out.updatedAt=Math.max(L.updatedAt||0,R.updatedAt||0);S=out;
  const del=new Set(S.deletedNotes);const nm=new Map();[...(d.notes||[]),...NOTES].forEach(n=>{if(n&&n.id&&!del.has(n.id))nm.set(n.id,n)});
  NOTES=[...nm.values()].sort((a,b)=>(b.date+b.createdAt)>(a.date+a.createdAt)?1:-1);
  lsSet(S);try{localStorage.setItem(NKEY,JSON.stringify(NOTES))}catch(e){}}
async function syncNow(){const c=syncCfg();if(!c||IN_ARTIFACT)return;if(syncing){syncAgain=true;return}syncing=true;setSyncState("sync");
  const before=JSON.stringify([S.week,S.day,NOTES.length,Object.keys(S.srs).length,S.doneToday]);
  try{let done=false;for(let i=0;i<3&&!done;i++){
      const rows=await rpc("eigo52_pull",{p_code:SYNCPFX+c.code});const remote=rows&&rows[0];
      if(remote)mergeRemote(remote.data);
      const r=await rpc("eigo52_push",{p_code:SYNCPFX+c.code,p_data:{app:"hindi52",v:1,state:S,notes:NOTES},p_base:remote?remote.updated_at:null});
      if(r&&r.ok){setSyncCfg(Object.assign(syncCfg()||c,{last:Date.now()}));done=true}}
    setSyncState(done?"ok":"ng")}
  catch(e){setSyncState("ng")}
  syncing=false;
  const after=JSON.stringify([S.week,S.day,NOTES.length,Object.keys(S.srs).length,S.doneToday]);
  if(before!==after&&$("#lesson").hidden)render();
  if(syncAgain){syncAgain=false;scheduleSync()}}
function setSyncState(s){syncState=s;const el=document.getElementById("syncchip");if(el)el.innerHTML=syncChipText()}
function syncChipText(){const c=syncCfg();if(!c)return"";
  if(syncState==="sync")return"☁ 同期中…";if(syncState==="ng")return"☁ 同期できませんでした";
  return c.last?"☁ 同期 "+new Date(c.last).toTimeString().slice(0,5):"☁ つながっています"}
function syncCard(){if(IN_ARTIFACT)return"";const c=syncCfg();
  if(!c)return `<div class="card stack" id="synccard"><div class="mascot-side">${pic("sync-devices","","")}<h3>iPhone と iPad をつなぐ</h3></div>
   <p class="small">「合言葉」で2台の記録（進み具合・カード・会話ノート・話した相手）を自動でそろえます。ログインは不要です。英語52週の合言葉とは別に作ってください。</p>
   <p class="small"><b>1台目（例：iPhone）</b>で「合言葉を作る」→ 表示された合言葉を <b>2台目（iPad）</b>の「合言葉を入れてつなぐ」に入れます。</p>
   <div><button class="btn accent" data-act="syncnew">この端末で合言葉を作る</button></div>
   <label class="small" for="sync-in">合言葉を入れてつなぐ（2台目）</label>
   <input type="text" id="sync-in" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" style="font-family:var(--f-mono)">
   <div><button class="btn" data-act="syncjoin">つなぐ</button></div>
   <p class="small muted">合言葉を知っている人は記録を見られるので、人には教えないでください。</p></div>`;
  return `<div class="card stack" id="synccard"><div class="spread"><h3>iPhone と iPad をつなぐ</h3><span class="chip g" id="syncchip">${syncChipText()}</span></div>
   <p class="small">この端末はつながっています。もう1台に、この合言葉を入れてください。</p>
   <div class="mono" style="font-size:20px;font-weight:600;letter-spacing:.06em;overflow-wrap:anywhere">${esc(c.code)}</div>
   <div class="row"><button class="btn sm" data-act="synccopy">合言葉をコピー</button>${navigator.share?`<button class="btn sm" data-act="syncshare">AirDrop などで送る</button>`:""}<button class="btn sm" data-act="syncnow">今すぐ同期</button></div>
   <textarea id="sync-code-src" readonly hidden style="min-height:40px">${esc(c.code)}</textarea>
   <div><button class="btn sm ghost" data-act="syncoff" id="syncoffbtn">この端末の同期をやめる</button></div></div>`}
async function syncJoin(code){code=normCode(code);if(code.replace(/-/g,"").length<16){toast("合言葉が短すぎます");return}
  try{const rows=await rpc("eigo52_pull",{p_code:SYNCPFX+code});if(!rows||!rows[0]){toast("その合言葉は見つかりません。1台目の合言葉を確かめてください");return}
    setSyncCfg({code});await syncNow();render();toast("つながりました。記録をそろえました")}
  catch(e){toast("つながりませんでした。インターネット接続を確かめてください")}}

/* ============ イベント ============ */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){e.stopPropagation();stopSpeak();speak(s.dataset.say,null,s.dataset.voice);return}
  const tb=e.target.closest(".nav [data-tab]");if(tb){TAB=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const tk=e.target.closest("#app [data-task]");if(tk){const i=+tk.dataset.task;const vw=viewWD();TASK_AT={week:vw.week,day:vw.day};runTask(planTasks(vw.week,vw.day)[i],W(vw.week),i);return}
  const vd=e.target.closest("#app [data-vday]");if(vd){const d=+vd.dataset.vday;const vw=viewWD();VIEW=(vw.week===S.week&&d===S.day)?null:{week:vw.week,day:d};render();return}
  const gw=e.target.closest("[data-gweek]");if(gw){openWeekReview(+gw.dataset.gweek);return}
  const pe=e.target.closest("#app [data-person]");if(pe){openPerson(pe.dataset.person);return}
  const nt=e.target.closest("#app [data-note]");if(nt){openNote(nt.dataset.note);return}
  const wk=e.target.closest("#app [data-week]");if(wk){const n=+wk.dataset.week;n<=S.week?openWeekReview(n):openWeek(n);return}
  const a=e.target.closest("#app [data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="vprev"||act==="vnext"){const vw=viewWD();const nw=Math.max(1,Math.min(S.week,vw.week+(act==="vprev"?-1:1)));VIEW=nw===S.week?null:{week:nw,day:1};render();return}
  if(act==="vtoday"){VIEW=null;render();window.scrollTo(0,0);return}
  if(act==="growth"){TAB="record";VIEW=null;render();setTimeout(()=>{const g=document.getElementById("growth");if(g)g.scrollIntoView({behavior:"smooth"})},60);return}
  if(act==="nextday"){VIEW=null;if(S.day<7)S.day++;else if(S.week<52){S.week++;S.day=1}S.doneToday={date:today(),tasks:[]};save();render();window.scrollTo(0,0);toast(`Week ${S.week} の ${S.day}日目へ`)}
  else if(act==="addscore"){const r=$("#sc-res").value.trim();if(!r){toast("結果を入力してください");return}S.scores.push({date:$("#sc-date").value,test:$("#sc-test").value,result:r});save();render();toast("記録しました")}
  else if(act==="newnote"){openNoteEditor()}
  else if(act==="quickpaste"){pasteInto($("#quick-raw"))}
  else if(act==="quickgo"){const v=$("#quick-raw").value.trim();if(!v){toast("会話を貼り付けてください");return}openNoteEditor("",v);$("#quick-raw").value=""}
  else if(act==="intro"){openIntro(0)}
  else if(act==="pron"){openPron(0)}
  else if(act==="hk"){openHitokoto("today")}
  else if(act==="daycheck"){lessonDayCheck()}
  else if(act==="book"){openPresentBook()}
  else if(act==="teacher"){openTeacher()}
  else if(act==="catch"){lessonCatch()}
  else if(act==="quicklog"){openQuickLog("")}
  else if(act==="notereview"){lessonCards(dueNoteKeys().slice(0,30).map(cardFromKey).filter(Boolean),"ノートの復習",()=>{logMinutes(10,"note");save();closeLesson()},true)}
  else if(act==="backup"||act==="backupcopy"){const data=JSON.stringify({app:"hindi52",v:1,savedAt:new Date().toISOString(),state:S,notes:NOTES});
    if(act==="backup"){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="hindi52-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast("保存しました（ファイルAppの「ダウンロード」）")}catch(e){toast("保存できませんでした。コピーを使ってください")}}
    else copyText(data,$("#bk-text"))}
  else if(act==="restore"){restoreBackup($("#bk-paste").value)}
  else if(act==="syncnew"){setSyncCfg({code:genCode()});syncNow().then(()=>{render();toast("合言葉を作りました。もう1台に入れてください")});render()}
  else if(act==="syncjoin"){syncJoin($("#sync-in").value)}
  else if(act==="synccopy"){copyText(syncCfg().code,$("#sync-code-src"))}
  else if(act==="syncshare"){navigator.share({title:"ヒンディー語52週の合言葉",text:syncCfg().code}).catch(()=>{})}
  else if(act==="syncnow"){syncNow().then(()=>{render();toast(syncState==="ok"?"同期しました":"同期できませんでした")})}
  else if(act==="syncoff"){const b=$("#syncoffbtn");if(!b.dataset.ok){b.dataset.ok=1;b.textContent="もう一度押すと、この端末の同期をやめます（記録は残ります）";return}setSyncCfg(null);render();toast("この端末の同期をやめました")}
  else if(act==="testvoice"){speak("नमस्ते, मैं आकिहिरो हूँ। आपसे मिलकर खुशी हुई।")}
  else if(act==="cyclescript"){const o=SCRIPTORDER;S.settings.script=o[(o.indexOf(S.settings.script||"full")+1)%o.length];save();render();toast("表示："+SCRIPTNAME[S.settings.script])}
});
document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input[type=text]"))setTimeout(()=>{try{e.target.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}},350)});
function restoreBackup(txt){const d=parseJSONLoose(txt);if(!d||d.app!=="hindi52"||!d.state){toast(d&&d.app==="eigo52"?"これは英語52週のバックアップです":"バックアップの形が違います");return}
  S=merge(d.state);NOTES=Array.isArray(d.notes)?d.notes:[];save();saveNotesLocal();NOTES.forEach(n=>pushNote(n));render();toast("バックアップを読み込みました")}
document.addEventListener("change",e=>{
  if(e.target.id==="bk-file"&&e.target.files[0]){const r=new FileReader();r.onload=()=>restoreBackup(String(r.result||""));r.readAsText(e.target.files[0])}
  if(e.target.id==="set-script"){S.settings.script=e.target.value;save();render()}
  if(e.target.id==="set-course"){S.settings.course=e.target.checked?"3h":"1h";if(e.target.checked)S.settings.c3from=dayIdx(S.week,S.day);save();toast(e.target.checked?"1日3時間コースにしました":"1日1時間コースにしました");return}
  if(e.target.id==="set-natural"){S.settings.natural=e.target.checked;save();speak("नमस्ते, मैं स्वरा हूँ। चलिए, साथ में हिंदी सीखते हैं।")}
  if(e.target.id==="set-voice"){const [nm,uri]=e.target.value.split("|");S.settings.voiceName=nm||"";S.settings.voiceURI=uri||"";save();render();speak("नमस्ते, मैं आकिहिरो हूँ।")}
  if(e.target.id==="set-rate"){S.settings.rate=+e.target.value;save()}
  if(e.target.id==="set-start"&&e.target.value){S.startDate=e.target.value;save()}
});
const _rg=render;render=function(){_rg();const a=$("#set-script");if(a)a.value=S.settings.script||"full";const r=$("#set-rate");if(r)r.value=String(S.settings.rate)};
initStore().then(()=>{if(!IN_ARTIFACT&&syncCfg()){syncNow();setInterval(()=>{if(document.visibilityState==="visible")syncNow()},120000)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!IN_ARTIFACT&&syncCfg())syncNow()});
</script>
